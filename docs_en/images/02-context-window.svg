<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="assistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="attnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" rx="16" fill="url(#bgGrad)"/>
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="560" stroke="#fff"/>
    <line x1="180" y1="0" x2="180" y2="560" stroke="#fff"/>
    <line x1="300" y1="0" x2="300" y2="560" stroke="#fff"/>
    <line x1="420" y1="0" x2="420" y2="560" stroke="#fff"/>
    <line x1="540" y1="0" x2="540" y2="560" stroke="#fff"/>
    <line x1="660" y1="0" x2="660" y2="560" stroke="#fff"/>
    <line x1="780" y1="0" x2="780" y2="560" stroke="#fff"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="0.5">Context window: the dialogue you imagine vs what actually happens</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">Every turn starts from scratch — a bounded text input box</text>

  <!-- ==================== CONTEXT WINDOW VISUALIZATION ==================== -->
  <g filter="url(#cardShadow)" transform="translate(40, 90)">
    <!-- Window frame -->
    <rect width="520" height="340" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect width="520" height="32" rx="14" fill="#1e293b"/>
    <rect y="20" width="520" height="12" fill="#1e293b"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="16" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="16" r="5" fill="#10b981" opacity="0.8"/>
    <text x="260" y="20" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Context Window — 128K tokens</text>

    <!-- Capacity bar -->
    <rect x="16" y="40" width="488" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="40" width="380" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
    <text x="410" y="47" fill="#f59e0b" font-size="8">78% used</text>

    <!-- System Prompt section -->
    <g transform="translate(16, 58)">
      <rect width="488" height="48" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.8"/>
      <rect width="4" height="48" rx="2" fill="url(#sysGrad)"/>
      <text x="16" y="18" fill="#8b5cf6" font-size="10" font-weight="600">SYSTEM</text>
      <text x="16" y="34" fill="#94a3b8" font-size="10">You are a senior Go engineer, expert in high-concurrency system design...</text>
      <text x="430" y="18" fill="#64748b" font-size="8">~500 tokens</text>
    </g>

    <!-- User message 1 -->
    <g transform="translate(16, 114)">
      <rect width="488" height="36" rx="8" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6"/>
      <rect width="4" height="36" rx="2" fill="url(#userGrad)"/>
      <text x="16" y="16" fill="#3b82f6" font-size="10" font-weight="600">USER (turn 1)</text>
      <text x="16" y="30" fill="#94a3b8" font-size="10">Refactor the error-handling in the auth module...</text>
      <text x="430" y="16" fill="#64748b" font-size="8">~200 tokens</text>
    </g>

    <!-- Assistant response 1 -->
    <g transform="translate(16, 156)">
      <rect width="488" height="36" rx="8" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="0.6"/>
      <rect width="4" height="36" rx="2" fill="url(#assistGrad)"/>
      <text x="16" y="16" fill="#10b981" font-size="10" font-weight="600">ASSISTANT (turn 1)</text>
      <text x="16" y="30" fill="#94a3b8" font-size="10">Sure, let me look at the structure of the auth module...</text>
      <text x="430" y="16" fill="#64748b" font-size="8">~800 tokens</text>
    </g>

    <!-- More rounds (compressed) -->
    <g transform="translate(16, 198)">
      <rect width="488" height="28" rx="6" fill="#3b82f6" fill-opacity="0.04" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3"/>
      <text x="244" y="18" text-anchor="middle" fill="#475569" font-size="10">... turns 2–9 (each turn kept in full) ...</text>
      <text x="430" y="18" fill="#64748b" font-size="8">~15K tokens</text>
    </g>

    <!-- User message 10 -->
    <g transform="translate(16, 232)">
      <rect width="488" height="36" rx="8" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-width="0.6"/>
      <rect width="4" height="36" rx="2" fill="url(#userGrad)"/>
      <text x="16" y="16" fill="#3b82f6" font-size="10" font-weight="600">USER (turn 10)</text>
      <text x="16" y="30" fill="#94a3b8" font-size="10">Make the function we just wrote async</text>
      <text x="430" y="16" fill="#64748b" font-size="8">~50 tokens</text>
    </g>

    <!-- Generation cursor -->
    <g transform="translate(16, 276)">
      <rect width="488" height="36" rx="8" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-width="0.6" stroke-dasharray="4 3"/>
      <rect width="4" height="36" rx="2" fill="#10b981" opacity="0.5"/>
      <text x="16" y="16" fill="#10b981" font-size="10" font-weight="600">ASSISTANT (generating...)</text>
      <rect x="16" y="24" width="2" height="10" fill="#10b981" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="30" fill="#64748b" font-size="10">← predicts the next token from everything above</text>
    </g>

    <!-- Truncation warning -->
    <g transform="translate(16, 316)">
      <text x="244" y="14" text-anchor="middle" fill="#ef4444" font-size="9" opacity="0.7">⚠ Once the window fills up, the oldest messages are truncated — not "vaguely remembered," but gone</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: Lost in the Middle ==================== -->
  <g filter="url(#cardShadow)" transform="translate(590, 90)">
    <rect width="280" height="200" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
    <rect width="280" height="3" rx="1.5" fill="#f59e0b" y="0"/>
    <text x="140" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Lost in the Middle</text>
    <text x="140" y="42" text-anchor="middle" fill="#64748b" font-size="10">Attention is unevenly distributed</text>

    <!-- Attention curve visualization -->
    <g transform="translate(24, 55)">
      <!-- Axis -->
      <line x1="0" y1="100" x2="232" y2="100" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#334155" stroke-width="1"/>
      <!-- U-shaped attention curve -->
      <path d="M 0 15 C 20 20, 40 70, 60 80 C 80 88, 100 90, 116 90 C 132 90, 152 88, 172 80 C 192 70, 212 20, 232 15" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <!-- Fill under curve -->
      <path d="M 0 15 C 20 20, 40 70, 60 80 C 80 88, 100 90, 116 90 C 132 90, 152 88, 172 80 C 192 70, 212 20, 232 15 L 232 100 L 0 100 Z" fill="#f59e0b" opacity="0.08"/>
      <!-- Danger zone highlight -->
      <rect x="60" y="0" width="112" height="100" fill="#ef4444" opacity="0.05" rx="4"/>
      <text x="116" y="75" text-anchor="middle" fill="#ef4444" font-size="9" opacity="0.8">Attention valley</text>
      <!-- Labels -->
      <text x="0" y="115" fill="#8b5cf6" font-size="9" font-weight="600">Start</text>
      <text x="100" y="115" text-anchor="middle" fill="#ef4444" font-size="9">Middle</text>
      <text x="232" y="115" text-anchor="end" fill="#3b82f6" font-size="9" font-weight="600">End</text>
      <!-- Y-axis label -->
      <text x="-8" y="55" fill="#64748b" font-size="8" transform="rotate(-90, -8, 55)">Attention strength</text>
    </g>

    <text x="140" y="184" text-anchor="middle" fill="#94a3b8" font-size="9">Put key info at the start or end —</text>
    <text x="140" y="196" text-anchor="middle" fill="#94a3b8" font-size="9">don't bury it in the middle</text>
  </g>

  <!-- ==================== RIGHT SIDE: Key Insight ==================== -->
  <g filter="url(#cardShadow)" transform="translate(590, 305)">
    <rect width="280" height="125" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <rect width="280" height="3" rx="1.5" fill="#3b82f6" y="0"/>
    <text x="140" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Core insight</text>
    <line x1="20" y1="36" x2="260" y2="36" stroke="#334155" stroke-width="1"/>
    <text x="20" y="56" fill="#94a3b8" font-size="10">✦ Every turn is processed from scratch</text>
    <text x="20" y="74" fill="#94a3b8" font-size="10">✦ "Memory" = past messages still in the window</text>
    <text x="20" y="92" fill="#94a3b8" font-size="10">✦ Context quality matters more than volume</text>
    <text x="20" y="112" fill="#64748b" font-size="9" font-style="italic">At its core: strings concatenated into a bounded text box</text>
  </g>

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(40, 450)">
    <rect width="820" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.6"/>
    <text x="410" y="22" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Evolution of the interaction paradigm</text>
    <line x1="20" y1="32" x2="800" y2="32" stroke="#334155" stroke-width="1"/>
    <!-- Three eras -->
    <g transform="translate(20, 42)">
      <rect width="240" height="36" rx="8" fill="#475569" fill-opacity="0.15" stroke="#475569" stroke-width="0.8"/>
      <circle cx="16" cy="18" r="6" fill="#475569"/>
      <text x="30" y="15" fill="#94a3b8" font-size="11" font-weight="600">Completion era</text>
      <text x="30" y="30" fill="#64748b" font-size="9">Completion mode → line-by-line</text>
    </g>
    <text x="272" y="62" fill="#475569" font-size="14">→</text>
    <g transform="translate(290, 42)">
      <rect width="240" height="36" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="0.8"/>
      <circle cx="16" cy="18" r="6" fill="#3b82f6"/>
      <text x="30" y="15" fill="#93c5fd" font-size="11" font-weight="600">Chat era</text>
      <text x="30" y="30" fill="#64748b" font-size="9">Instruction following → conversation</text>
    </g>
    <text x="542" y="62" fill="#475569" font-size="14">→</text>
    <g transform="translate(560, 42)">
      <rect width="240" height="36" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="16" cy="18" r="6" fill="#10b981"/>
      <text x="30" y="15" fill="#6ee7b7" font-size="11" font-weight="600">Agent era</text>
      <text x="30" y="30" fill="#64748b" font-size="9">Planned execution → autonomous delegation</text>
    </g>
  </g>
</svg>