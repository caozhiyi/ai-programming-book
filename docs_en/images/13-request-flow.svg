<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="520" rx="14" fill="url(#bgGrad)"/>

  <text x="400" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">The full journey of one request: from user input to code delivery</text>

  <!-- Step 1: User Input -->
  <g transform="translate(30, 55)">
    <rect width="130" height="44" rx="8" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">① User input</text>
    <text x="65" y="34" text-anchor="middle" fill="#64748b" font-size="8">"Add a bulk import method"</text>
  </g>
  <line x1="160" y1="77" x2="185" y2="77" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: Route Selection -->
  <g transform="translate(190, 55)">
    <rect width="120" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="18" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">② Path selection</text>
    <text x="60" y="34" text-anchor="middle" fill="#64748b" font-size="8">→ Agent path</text>
  </g>
  <line x1="310" y1="77" x2="335" y2="77" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Spec Loading -->
  <g transform="translate(340, 55)">
    <rect width="120" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="18" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">③ Spec loading</text>
    <text x="60" y="34" text-anchor="middle" fill="#64748b" font-size="8">Skill · .cursorrules</text>
  </g>
  <line x1="460" y1="77" x2="485" y2="77" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Context Assembly -->
  <g transform="translate(490, 55)">
    <rect width="130" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="18" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">④ Context assembly</text>
    <text x="65" y="34" text-anchor="middle" fill="#64748b" font-size="8">Memory + knowledge + tools</text>
  </g>
  <line x1="620" y1="77" x2="645" y2="77" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 5: Planning -->
  <g transform="translate(650, 55)">
    <rect width="120" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="18" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">⑤ Plan</text>
    <text x="60" y="34" text-anchor="middle" fill="#64748b" font-size="8">Coarse-grained draft</text>
  </g>

  <!-- Arrow down to ReAct loop -->
  <line x1="710" y1="99" x2="710" y2="130" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ReAct Loop Box -->
  <g transform="translate(50, 135)">
    <rect width="720" height="280" rx="12" fill="#1e293b" opacity="0.3" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="360" y="22" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">⑥ ReAct execution loop</text>
  </g>

  <!-- Loop iteration 1 -->
  <g transform="translate(80, 170)">
    <rect width="140" height="55" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">THINK</text>
    <text x="70" y="32" text-anchor="middle" fill="#64748b" font-size="8">"Needs to read</text>
    <text x="70" y="44" text-anchor="middle" fill="#64748b" font-size="8">UserService code"</text>
  </g>
  <line x1="220" y1="198" x2="245" y2="198" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <g transform="translate(250, 170)">
    <rect width="140" height="55" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="600">ACTION</text>
    <text x="70" y="32" text-anchor="middle" fill="#64748b" font-size="8">read_file</text>
    <text x="70" y="44" text-anchor="middle" fill="#64748b" font-size="8">"user_service.go"</text>
  </g>
  <line x1="390" y1="198" x2="415" y2="198" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <g transform="translate(420, 170)">
    <rect width="140" height="55" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">OBSERVE</text>
    <text x="70" y="32" text-anchor="middle" fill="#64748b" font-size="8">Discover Repository</text>
    <text x="70" y="44" text-anchor="middle" fill="#64748b" font-size="8">Custom interface →</text>
  </g>
  <line x1="560" y1="198" x2="585" y2="198" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <g transform="translate(590, 170)">
    <rect width="150" height="55" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="75" y="16" text-anchor="middle" fill="#f472b6" font-size="9" font-weight="600">📝 Plan revision</text>
    <text x="75" y="32" text-anchor="middle" fill="#64748b" font-size="8">Insert a new step:</text>
    <text x="75" y="44" text-anchor="middle" fill="#64748b" font-size="8">"Read the Repository definition"</text>
  </g>

  <!-- Loop iteration 2 -->
  <line x1="665" y1="225" x2="665" y2="250" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <g transform="translate(80, 255)">
    <rect width="310" height="40" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="155" y="16" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">THINK → ACTION → OBSERVE (read Repository → understand DB schema)</text>
    <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="8">Context keeps accumulating: task description + code + interface definitions</text>
  </g>

  <!-- Loop iteration 3 -->
  <g transform="translate(420, 255)">
    <rect width="310" height="40" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="155" y="16" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="600">THINK → ACTION (generate code + tests) → OBSERVE</text>
    <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="8">Spec constraints stay in effect: error wrapping · slog · naming conventions</text>
  </g>

  <!-- Loop iteration 4: Test -->
  <g transform="translate(80, 315)">
    <rect width="310" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="155" y="16" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">ACTION: run_command "go test" → OBSERVE: all passed ✓</text>
    <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="8">Verification: compile check + test run + spec compliance</text>
  </g>

  <!-- Loop iteration 5: Complete -->
  <g transform="translate(420, 315)">
    <rect width="310" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="155" y="16" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">THINK: task complete → ACTION: complete</text>
    <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="8">Termination decision: tests pass + spec compliant → emit the diff</text>
  </g>

  <!-- Step 7: Output -->
  <g transform="translate(250, 440)">
    <rect width="300" height="50" rx="10" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="150" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">⑦ Deliver result</text>
    <text x="150" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">Code diff · execution notes · test results</text>
  </g>
  <line x1="400" y1="415" x2="400" y2="440" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
