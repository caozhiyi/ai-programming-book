<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Stack-selection decision tree: from task profile to choice</text>

  <!-- Q1 -->
  <g transform="translate(280, 50)">
    <rect width="240" height="36" rx="18" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="23" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">❶ Need tool interaction?</text>
  </g>
  <text x="540" y="72" fill="#475569" font-size="8" font-style="italic">i.e. read/write files, run shell, or call APIs</text>

  <!-- No → Direct chat -->
  <line x1="340" y1="86" x2="160" y2="116" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="230" y="96" fill="#10b981" font-size="9">No</text>
  <g transform="translate(60, 114)">
    <rect width="180" height="32" rx="6" fill="#065f46" opacity="0.7"/>
    <text x="90" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">→ direct chat</text>
  </g>

  <!-- Yes → Q2 -->
  <line x1="400" y1="86" x2="400" y2="116" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="414" y="104" fill="#94a3b8" font-size="9">Yes</text>

  <!-- Q2 -->
  <g transform="translate(280, 120)">
    <rect width="240" height="36" rx="18" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="23" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">❷ Need multi-step execution?</text>
  </g>
  <text x="540" y="142" fill="#475569" font-size="8" font-style="italic">i.e. > 1 step with dependencies</text>

  <!-- No → Function Calling -->
  <line x1="340" y1="156" x2="160" y2="186" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="230" y="166" fill="#10b981" font-size="9">No (one-off)</text>
  <g transform="translate(60, 184)">
    <rect width="180" height="32" rx="6" fill="#065f46" opacity="0.7"/>
    <text x="90" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">→ single Function Call</text>
  </g>

  <!-- Yes → Q3 -->
  <line x1="400" y1="156" x2="400" y2="186" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="414" y="174" fill="#94a3b8" font-size="9">Yes</text>

  <!-- Q3 -->
  <g transform="translate(280, 190)">
    <rect width="240" height="36" rx="18" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="23" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">❸ Need distinct specialist roles?</text>
  </g>
  <text x="540" y="212" fill="#475569" font-size="8" font-style="italic">i.e. exclusive Skills or separate contexts</text>

  <!-- No → Single Agent -->
  <line x1="340" y1="226" x2="160" y2="256" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="230" y="236" fill="#10b981" font-size="9">No (single role)</text>
  <g transform="translate(60, 254)">
    <rect width="180" height="32" rx="6" fill="#065f46" opacity="0.7"/>
    <text x="90" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">→ single Agent</text>
  </g>

  <!-- Yes → Q4 -->
  <line x1="460" y1="226" x2="600" y2="256" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="540" y="236" fill="#f59e0b" font-size="9">Yes (multiple perspectives needed)</text>
  <g transform="translate(530, 254)">
    <rect width="200" height="32" rx="6" fill="#78350f" opacity="0.7"/>
    <text x="100" y="20" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">→ consider multi-agent</text>
  </g>

  <!-- Separator -->
  <line x1="60" y1="310" x2="740" y2="310" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="400" y="330" text-anchor="middle" fill="#64748b" font-size="10">How capabilities extend</text>

  <!-- Three columns -->
  <!-- Built-in tools -->
  <g transform="translate(60, 345)">
    <rect width="200" height="80" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">🔧 Built-in tools</text>
    <text x="100" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">High-frequency core operations</text>
    <text x="100" y="54" text-anchor="middle" fill="#64748b" font-size="8">Read/write files · code search · shell</text>
    <text x="100" y="70" text-anchor="middle" fill="#475569" font-size="8">Lowest latency · highest stability</text>
  </g>

  <!-- MCP -->
  <g transform="translate(300, 345)">
    <rect width="200" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">🔌 MCP</text>
    <text x="100" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">Standardized external integration</text>
    <text x="100" y="54" text-anchor="middle" fill="#64748b" font-size="8">Databases · third-party APIs · internal services</text>
    <text x="100" y="70" text-anchor="middle" fill="#475569" font-size="8">Cross-platform reuse · dynamic discovery</text>
  </g>

  <!-- Skill -->
  <g transform="translate(540, 345)">
    <rect width="200" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">📋 Skill</text>
    <text x="100" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">Persistent behavioral constraints</text>
    <text x="100" y="54" text-anchor="middle" fill="#64748b" font-size="8">Coding spec · patterns · review checklist</text>
    <text x="100" y="70" text-anchor="middle" fill="#475569" font-size="8">Changes "how" · not one-off</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(60, 445)">
    <rect width="680" height="26" rx="6" fill="#1e293b" opacity="0.5"/>
    <text x="340" y="17" text-anchor="middle" fill="#64748b" font-size="9">💡 Core principle: start with the simplest option; only upgrade when it's clearly not enough. Complexity has a cost.</text>
  </g>
</svg>
