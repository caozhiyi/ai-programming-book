<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0 6, 8 6, 4 0" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="14" fill="url(#bgGrad)"/>

  <text x="450" y="28" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">The seven-layer architecture of an AI coding system</text>
  <text x="450" y="46" text-anchor="middle" fill="#64748b" font-size="10">Each layer solves one isolated problem; layers interact through explicit data contracts</text>

  <!-- ===== MAIN ARCHITECTURE: 7 Layers in 3 Columns ===== -->

  <!-- Column Headers -->
  <text x="160" y="72" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Capability supply (what the Agent can do)</text>
  <text x="450" y="72" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Core engine (how the Agent thinks)</text>
  <text x="740" y="72" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Knowledge supply (what the Agent knows)</text>

  <!-- ===== LEFT COLUMN: Capability Layers ===== -->

  <!-- Tool Layer (MCP) -->
  <g filter="url(#cardShadow)" transform="translate(30, 85)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#06b6d4"/>
    <text x="20" y="18" fill="#67e8f9" font-size="11" font-weight="700">🔧 Tool layer (MCP)</text>
    <text x="200" y="18" fill="#64748b" font-size="8">Ch.3-4</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">Read/write files · run commands · call APIs</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Protocol: JSON-RPC over stdio/SSE</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Constraints: description ≤ 200 tok · payload ≤ 4K</text>
    <text x="20" y="84" fill="#06b6d4" font-size="7" opacity="0.7">→ output: structured tool result (string / JSON)</text>
  </g>

  <!-- Skill Layer -->
  <g filter="url(#cardShadow)" transform="translate(30, 185)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#8b5cf6"/>
    <text x="20" y="18" fill="#a78bfa" font-size="11" font-weight="700">📋 Capability layer (Skill)</text>
    <text x="200" y="18" fill="#64748b" font-size="8">Ch.5</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">Coding specs · arch patterns · workflows</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Loading: injected into System Prompt per scenario</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Constraints: single Skill ≤ 2K tok · ≤ 3 active</text>
    <text x="20" y="84" fill="#8b5cf6" font-size="7" opacity="0.7">→ output: instruction text (injected into context window)</text>
  </g>

  <!-- Collaboration Layer -->
  <g filter="url(#cardShadow)" transform="translate(30, 285)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#ec4899"/>
    <text x="20" y="18" fill="#f472b6" font-size="11" font-weight="700">👥 Collaboration (Multi-Agent)</text>
    <text x="230" y="18" fill="#64748b" font-size="8">Ch.6</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">Parallel exec · role specialization · merging</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Pattern: Orchestrator → SubAgent (independent contexts)</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Constraints: no shared memory · results merged</text>
    <text x="20" y="84" fill="#ec4899" font-size="7" opacity="0.7">→ output: subtask result (text / code fragment)</text>
  </g>

  <!-- ===== CENTER COLUMN: Core Engine ===== -->

  <!-- Agent Layer (Central) -->
  <g filter="url(#cardShadow)" transform="translate(320, 155)">
    <rect width="260" height="120" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="130" y="22" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">🧠 Agent layer</text>
    <text x="130" y="38" text-anchor="middle" fill="#64748b" font-size="9">Ch.3, 7, 11</text>
    <line x1="16" y1="46" x2="244" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="16" y="62" fill="#94a3b8" font-size="9">Reason → plan → tool selection → execute → verify</text>
    <text x="16" y="78" fill="#94a3b8" font-size="9">Loop: ReAct (Reason + Act) Loop</text>
    <text x="16" y="94" fill="#64748b" font-size="8">Input: full context window (concatenated string)</text>
    <text x="16" y="108" fill="#64748b" font-size="8">Output: the next action (tool call / text reply)</text>
  </g>

  <!-- User -->
  <g filter="url(#cardShadow)" transform="translate(370, 85)">
    <rect width="160" height="50" rx="10" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="80" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">👤 User</text>
    <text x="80" y="38" text-anchor="middle" fill="#94a3b8" font-size="8">NL instructions · approve / reject</text>
  </g>
  <!-- Arrow: User → Agent -->
  <line x1="450" y1="135" x2="450" y2="155" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ===== RIGHT COLUMN: Knowledge Layers ===== -->

  <!-- Memory Layer -->
  <g filter="url(#cardShadow)" transform="translate(610, 85)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#10b981"/>
    <text x="20" y="18" fill="#6ee7b7" font-size="11" font-weight="700">💾 Memory layer</text>
    <text x="200" y="18" fill="#64748b" font-size="8">Ch.8</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">User preferences · project conventions · past decisions</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Storage: vector DB + KV store · Retrieval: semantic + keyword</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Constraints: budget ≤ 15% of context · with decay</text>
    <text x="20" y="84" fill="#10b981" font-size="7" opacity="0.7">→ output: relevant memory snippets (injected into System region)</text>
  </g>

  <!-- Knowledge Layer (RAG) -->
  <g filter="url(#cardShadow)" transform="translate(610, 185)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#3b82f6"/>
    <text x="20" y="18" fill="#60a5fa" font-size="11" font-weight="700">📚 Knowledge layer (RAG)</text>
    <text x="200" y="18" fill="#64748b" font-size="8">Ch.10</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">Code-base index · doc retrieval · API reference</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Flow: Query → Embed → Search → Rerank → Inject</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Key constraints: retrieval latency ≤ 500ms · Top-K ≤ 5 chunks</text>
    <text x="20" y="84" fill="#3b82f6" font-size="7" opacity="0.7">→ output: relevant code/doc snippets (injected into User region)</text>
  </g>

  <!-- Spec Layer -->
  <g filter="url(#cardShadow)" transform="translate(610, 285)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="4" height="90" rx="2" fill="#f59e0b"/>
    <text x="20" y="18" fill="#fbbf24" font-size="11" font-weight="700">📐 Spec layer (OpenSpec)</text>
    <text x="200" y="18" fill="#64748b" font-size="8">Ch.12</text>
    <line x1="12" y1="26" x2="248" y2="26" stroke="#1e293b" stroke-width="0.5"/>
    <text x="20" y="42" fill="#94a3b8" font-size="9">Coding · security · quality · architecture rules</text>
    <text x="20" y="58" fill="#64748b" font-size="8">Format: declarative YAML/TOML · composable · verifiable</text>
    <text x="20" y="72" fill="#64748b" font-size="8">Key constraints: ≤ 50 rules · no conflicts · clear precedence</text>
    <text x="20" y="84" fill="#f59e0b" font-size="7" opacity="0.7">→ output: constraint rules (injected into System region)</text>
  </g>

  <!-- ===== CONNECTION ARROWS ===== -->
  <!-- Left → Center -->
  <line x1="290" y1="130" x2="320" y2="185" stroke="#06b6d4" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="290" y1="230" x2="320" y2="215" stroke="#8b5cf6" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="290" y1="330" x2="320" y2="245" stroke="#ec4899" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Right → Center -->
  <line x1="610" y1="130" x2="580" y2="185" stroke="#10b981" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="610" y1="230" x2="580" y2="215" stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="610" y1="330" x2="580" y2="245" stroke="#f59e0b" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- ===== BOTTOM: Request Lifecycle ===== -->
  <g transform="translate(30, 395)">
    <rect width="840" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <text x="420" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Lifecycle of one request ("Refactor the auth module")</text>
    <line x1="16" y1="28" x2="824" y2="28" stroke="#334155" stroke-width="0.5"/>

    <!-- Step 1 -->
    <g transform="translate(16, 36)">
      <rect width="110" height="50" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="600">① Memory retrieval</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">"User prefers slog"</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">"Wrap errors with AppError"</text>
    </g>
    <text x="132" y="62" fill="#94a3b8" font-size="10">→</text>

    <!-- Step 2 -->
    <g transform="translate(142, 36)">
      <rect width="110" height="50" rx="6" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#60a5fa" font-size="8" font-weight="600">② RAG retrieval</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">code under auth/</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">Auth-module docs</text>
    </g>
    <text x="258" y="62" fill="#94a3b8" font-size="10">→</text>

    <!-- Step 3 -->
    <g transform="translate(268, 36)">
      <rect width="110" height="50" rx="6" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="600">③ Skill loading</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">"Go refactor spec"</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">"Error-handling pattern"</text>
    </g>
    <text x="384" y="62" fill="#94a3b8" font-size="10">→</text>

    <!-- Step 4 -->
    <g transform="translate(394, 36)">
      <rect width="110" height="50" rx="6" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">④ Agent reasoning</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">Plan the refactor steps</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">Choose the tool sequence</text>
    </g>
    <text x="510" y="62" fill="#94a3b8" font-size="10">→</text>

    <!-- Step 5 -->
    <g transform="translate(520, 36)">
      <rect width="110" height="50" rx="6" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#67e8f9" font-size="8" font-weight="600">⑤ Tool execution</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">read_file → edit</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">run_tests → pass</text>
    </g>
    <text x="636" y="62" fill="#94a3b8" font-size="10">→</text>

    <!-- Step 6 -->
    <g transform="translate(646, 36)">
      <rect width="110" height="50" rx="6" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="0.6"/>
      <text x="55" y="14" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">⑥ Spec check</text>
      <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="7">lint pass ✓</text>
      <text x="55" y="40" text-anchor="middle" fill="#64748b" font-size="7">Conforms to OpenSpec ✓</text>
    </g>

    <!-- Token budget breakdown -->
    <g transform="translate(16, 96)">
      <text x="0" y="12" fill="#94a3b8" font-size="9" font-weight="600">Context-window allocation:</text>
      <rect x="130" y="2" width="60" height="14" rx="3" fill="#10b981" opacity="0.3"/>
      <text x="160" y="13" text-anchor="middle" fill="#6ee7b7" font-size="7">Memory 8%</text>
      <rect x="192" y="2" width="100" height="14" rx="3" fill="#3b82f6" opacity="0.3"/>
      <text x="242" y="13" text-anchor="middle" fill="#60a5fa" font-size="7">RAG knowledge 15%</text>
      <rect x="294" y="2" width="80" height="14" rx="3" fill="#8b5cf6" opacity="0.3"/>
      <text x="334" y="13" text-anchor="middle" fill="#a78bfa" font-size="7">Skill 12%</text>
      <rect x="376" y="2" width="100" height="14" rx="3" fill="#f59e0b" opacity="0.3"/>
      <text x="426" y="13" text-anchor="middle" fill="#fbbf24" font-size="7">Tool descriptions 10%</text>
      <rect x="478" y="2" width="120" height="14" rx="3" fill="#64748b" opacity="0.3"/>
      <text x="538" y="13" text-anchor="middle" fill="#94a3b8" font-size="7">Conversation history 25%</text>
      <rect x="600" y="2" width="120" height="14" rx="3" fill="#e2e8f0" opacity="0.2"/>
      <text x="660" y="13" text-anchor="middle" fill="#e2e8f0" font-size="7">Remaining (task) 30%</text>
    </g>

    <!-- Key insight -->
    <text x="420" y="132" text-anchor="middle" fill="#64748b" font-size="8" font-style="italic">Every layer competes for the same limited context space — that's why each one has a token budget</text>
  </g>
</svg>
