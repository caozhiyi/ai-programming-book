<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#bgGrad)"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Agent network: multi-agent collaboration architecture</text>

  <!-- Orchestrator Agent (center top) -->
  <g transform="translate(300, 55)">
    <rect width="200" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">🧠 Orchestrator Agent</text>
    <text x="100" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">Decompose · integrate · resolve conflicts</text>
  </g>

  <!-- User -->
  <g transform="translate(60, 65)">
    <rect width="100" height="36" rx="8" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="23" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">👤 User</text>
  </g>
  <line x1="160" y1="83" x2="300" y2="83" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Specialist Agents -->
  <!-- Frontend Agent -->
  <g transform="translate(50, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">🎨 Frontend Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">React/Vue components</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">UI logic · styling</text>
  </g>

  <!-- Backend Agent -->
  <g transform="translate(315, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">⚙️ Backend Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">API design · business logic</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">Database operations</text>
  </g>

  <!-- Test Agent -->
  <g transform="translate(580, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">🧪 Test Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">Unit tests · integration tests</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">Regression verification</text>
  </g>

  <!-- Connection lines from Orchestrator to Specialists -->
  <line x1="350" y1="110" x2="135" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="400" y1="110" x2="400" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="450" y1="110" x2="665" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Shared Protocol Layer -->
  <g transform="translate(100, 290)">
    <rect width="600" height="40" rx="8" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="300" y="16" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">📡 Agent-to-agent protocol (A2A)</text>
    <text x="300" y="32" text-anchor="middle" fill="#64748b" font-size="8">Capability declaration · task delegation · state sync · result return</text>
  </g>

  <!-- Connection from agents to protocol -->
  <line x1="135" y1="250" x2="135" y2="290" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="400" y1="250" x2="400" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="665" y1="250" x2="665" y2="290" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Challenges at bottom -->
  <g transform="translate(60, 360)">
    <rect width="200" height="60" rx="8" fill="#7f1d1d" opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">🔒 Challenge 1: passing trust</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">Is Agent B's output reliable?</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">Error propagates along the call chain</text>
  </g>

  <g transform="translate(300, 360)">
    <rect width="200" height="60" rx="8" fill="#78350f" opacity="0.3" stroke="#fbbf24" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">🔄 Challenge 2: state coordination</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">Multi-agent concurrent edits</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">Non-deterministic concurrency control</text>
  </g>

  <g transform="translate(540, 360)">
    <rect width="200" height="60" rx="8" fill="#1e3a5f" opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">📋 Challenge 3: standardization</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">Wire protocol · capability description</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">From MCP to A2A</text>
  </g>
</svg>
