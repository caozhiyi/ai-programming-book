
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="420" rx="12" fill="url(#bgGrad)"/>

  <!-- ===== Step 1: User Query (left) ===== -->
  <g filter="url(#glow)" transform="translate(30, 50)">
    <rect width="160" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="80" y="24" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700">User query</text>
    <line x1="12" y1="34" x2="148" y2="34" stroke="#334155" stroke-width="0.5"/>
    <text x="80" y="52" text-anchor="middle" fill="#e2e8f0" font-size="9">"Help me with OrderService</text>
    <text x="80" y="66" text-anchor="middle" fill="#e2e8f0" font-size="9">Add a cache layer"</text>
  </g>

  <!-- Arrow: Query → Retrieval -->
  <line x1="190" y1="90" x2="230" y2="90" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowWhite)"/>

  <!-- ===== Step 2: Dual Retrieval (center) ===== -->
  <g filter="url(#glow)" transform="translate(240, 20)">
    <rect width="280" height="140" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="140" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">Hybrid retrieval</text>
    <line x1="12" y1="30" x2="268" y2="30" stroke="#334155" stroke-width="0.5"/>

    <!-- Semantic search -->
    <g transform="translate(12, 38)">
      <rect width="120" height="50" rx="6" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="0.5"/>
      <text x="60" y="16" text-anchor="middle" fill="#06b6d4" font-size="9" font-weight="600">Semantic search</text>
      <text x="60" y="32" text-anchor="middle" fill="#64748b" font-size="8">Vector similarity match</text>
      <text x="60" y="44" text-anchor="middle" fill="#64748b" font-size="8">"Cache" ≈ "Cache-Aside"</text>
    </g>

    <!-- Keyword search -->
    <g transform="translate(148, 38)">
      <rect width="120" height="50" rx="6" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="60" y="16" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">Keyword search</text>
      <text x="60" y="32" text-anchor="middle" fill="#64748b" font-size="8">Exact text match</text>
      <text x="60" y="44" text-anchor="middle" fill="#64748b" font-size="8">"OrderService" → hit</text>
    </g>

    <!-- Merge -->
    <g transform="translate(12, 96)">
      <rect width="256" height="30" rx="6" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="0.5"/>
      <text x="128" y="12" text-anchor="middle" fill="#10b981" font-size="9" font-weight="600">Merge + rank → return Top-K most relevant memories</text>
      <text x="128" y="24" text-anchor="middle" fill="#475569" font-size="8">Semantic catches synonyms; keyword catches exact hits</text>
    </g>
  </g>

  <!-- Arrow: Retrieval → Results -->
  <line x1="380" y1="160" x2="380" y2="185" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowWhite)"/>

  <!-- ===== Step 3: Retrieved Results ===== -->
  <g filter="url(#glow)" transform="translate(140, 195)">
    <rect width="500" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="250" y="22" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">Retrieval results (ranked by relevance)</text>
    <line x1="12" y1="30" x2="488" y2="30" stroke="#334155" stroke-width="0.5"/>

    <!-- High relevance -->
    <circle cx="24" cy="46" r="5" fill="#10b981"/>
    <text x="36" y="50" fill="#e2e8f0" font-size="9">Cache strategy: Cache-Aside, TTL read from config center</text>
    <circle cx="24" cy="64" r="5" fill="#10b981"/>
    <text x="36" y="68" fill="#e2e8f0" font-size="9">Cache-key convention: {service}:{entity}:{id}</text>
    <circle cx="24" cy="82" r="5" fill="#10b981"/>
    <text x="36" y="86" fill="#e2e8f0" font-size="9">The project uses the cache.Store interface as the cache abstraction</text>

    <!-- Low relevance -->
    <circle cx="24" cy="100" r="5" fill="#475569"/>
    <text x="36" y="104" fill="#64748b" font-size="9">Project language Go 1.22 / DB PostgreSQL (medium-low relevance, may not be injected)</text>
  </g>

  <!-- Arrow: Results → Injection -->
  <line x1="380" y1="305" x2="380" y2="330" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- ===== Step 4: Injection into Context ===== -->
  <g filter="url(#glow)" transform="translate(100, 340)">
    <rect width="580" height="60" rx="10" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="290" y="20" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="700">Inject into working memory (context window)</text>
    <line x1="12" y1="28" x2="568" y2="28" stroke="#1e3a4a" stroke-width="0.5"/>

    <!-- Context layout -->
    <g transform="translate(12, 34)">
      <rect width="100" height="18" rx="4" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="50" y="13" text-anchor="middle" fill="#f59e0b" font-size="8">System Prompt</text>
    </g>
    <g transform="translate(120, 34)">
      <rect width="60" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.5"/>
      <text x="30" y="13" text-anchor="middle" fill="#8b5cf6" font-size="8">Tool defs</text>
    </g>
    <g transform="translate(188, 34)">
      <rect width="130" height="18" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
      <text x="65" y="13" text-anchor="middle" fill="#10b981" font-size="8" font-weight="600">⟨memory⟩ Retrieve memory</text>
    </g>
    <g transform="translate(326, 34)">
      <rect width="80" height="18" rx="4" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="0.5"/>
      <text x="40" y="13" text-anchor="middle" fill="#3b82f6" font-size="8">Chat history</text>
    </g>
    <g transform="translate(414, 34)">
      <rect width="100" height="18" rx="4" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="0.5"/>
      <text x="50" y="13" text-anchor="middle" fill="#64748b" font-size="8">Remaining space → task</text>
    </g>
  </g>
</svg>
