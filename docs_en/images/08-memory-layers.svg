<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="workingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="shortGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="longGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" rx="16" fill="url(#bgGrad)"/>
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="580" stroke="#fff"/>
    <line x1="180" y1="0" x2="180" y2="580" stroke="#fff"/>
    <line x1="300" y1="0" x2="300" y2="580" stroke="#fff"/>
    <line x1="420" y1="0" x2="420" y2="580" stroke="#fff"/>
    <line x1="540" y1="0" x2="540" y2="580" stroke="#fff"/>
    <line x1="660" y1="0" x2="660" y2="580" stroke="#fff"/>
    <line x1="780" y1="0" x2="780" y2="580" stroke="#fff"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">The three-layer model of memory</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">Build a stateful experience on top of a stateless engine</text>

  <!-- ==================== THREE LAYERS ==================== -->

  <!-- Layer 1: Working Memory -->
  <g filter="url(#cardShadow)" transform="translate(40, 90)">
    <rect width="260" height="280" rx="14" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#workingGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#workingGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">Working memory</text>
    <text x="56" y="46" fill="#06b6d4" font-size="10">Working Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#1e3a4a" stroke-width="0.8"/>

    <!-- Scope -->
    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#06b6d4" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="600">What's currently in the context window</text>
    </g>

    <!-- Description -->
    <text x="16" y="110" fill="#94a3b8" font-size="10">Everything the model "sees right now"</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">Reasons over it directly, no retrieval needed</text>

    <!-- Characteristics -->
    <line x1="16" y1="140" x2="244" y2="140" stroke="#1e3a4a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ Lifetime: a single inference call</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 Storage: the context window</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 Capacity: bounded (128K–200K tokens)</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ Access: fastest (directly visible)</text>

    <!-- Visual: context window -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#06b6d4" fill-opacity="0.05" stroke="#06b6d4" stroke-width="0.5"/>
      <text x="8" y="14" fill="#67e8f9" font-size="8" font-weight="600">Context window contents</text>
      <text x="8" y="28" fill="#64748b" font-size="8">📋 System Prompt + tool descriptions</text>
      <text x="8" y="42" fill="#64748b" font-size="8">💬 Conversation history + injected memory</text>
    </g>
  </g>

  <!-- Layer 2: Short-term Memory -->
  <g filter="url(#cardShadow)" transform="translate(320, 90)">
    <rect width="260" height="280" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#shortGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#shortGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">Short-term memory</text>
    <text x="56" y="46" fill="#8b5cf6" font-size="10">Short-term Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#2a1a4a" stroke-width="0.8"/>

    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">Compressed summary of conversation history</text>
    </g>

    <text x="16" y="110" fill="#94a3b8" font-size="10">Keep the key decisions and conclusions</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">Drop the discussion process and the details</text>

    <line x1="16" y1="140" x2="244" y2="140" stroke="#2a1a4a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ Lifetime: current session</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 Storage: client / server cache</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 Capacity: medium (smaller after summarization)</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ Access: needs loading into working memory</text>

    <!-- Visual: summary -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#8b5cf6" fill-opacity="0.05" stroke="#8b5cf6" stroke-width="0.5"/>
      <text x="8" y="14" fill="#a78bfa" font-size="8" font-weight="600">Summary example</text>
      <text x="8" y="28" fill="#64748b" font-size="8">📝 Decided on PostgreSQL; users table has 4 columns</text>
      <text x="8" y="42" fill="#64748b" font-size="8">📝 Add a unique index on email; use UUID for id</text>
    </g>
  </g>

  <!-- Layer 3: Long-term Memory -->
  <g filter="url(#cardShadow)" transform="translate(600, 90)">
    <rect width="260" height="280" rx="14" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#longGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#longGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">Long-term memory</text>
    <text x="56" y="46" fill="#f59e0b" font-size="10">Long-term Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#3a2a0a" stroke-width="0.8"/>

    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#f59e0b" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">Persistent storage across sessions</text>
    </g>

    <text x="16" y="110" fill="#94a3b8" font-size="10">Preferences, project knowledge, decisions</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">Stored externally, retrieved on demand</text>

    <line x1="16" y1="140" x2="244" y2="140" stroke="#3a2a0a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ Lifetime: forever (unless explicitly deleted)</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 Storage: database / vector store</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 Capacity: largest (keeps accumulating)</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ Access: slowest (needs retrieval + injection)</text>

    <!-- Visual: persistent store -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="8" y="14" fill="#fbbf24" font-size="8" font-weight="600">Persistent memory</text>
      <text x="8" y="28" fill="#64748b" font-size="8">🎯 Preferences: slog logging | tab indentation</text>
      <text x="8" y="42" fill="#64748b" font-size="8">🏗 Decisions: Cache-Aside | gRPC for communication</text>
    </g>
  </g>

  <!-- ==================== DATA FLOW ==================== -->

  <!-- Flow arrows between layers -->
  <!-- Long-term → Working: "回忆" -->
  <path d="M 640 375 C 640 400, 400 400, 300 380" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowCyan)" opacity="0.7"/>
  <text x="460" y="408" text-anchor="middle" fill="#f59e0b" font-size="9" opacity="0.9">Retrieve → inject (recall)</text>

  <!-- Working → Short-term: "压缩" -->
  <path d="M 300 372 L 370 372" stroke="#06b6d4" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <text x="335" y="386" text-anchor="middle" fill="#94a3b8" font-size="9">Compress</text>

  <!-- Short-term → Long-term: "记住" -->
  <path d="M 580 372 L 640 372" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrowAmber)" opacity="0.7"/>
  <text x="610" y="386" text-anchor="middle" fill="#94a3b8" font-size="9">Write</text>

  <!-- ==================== BOTTOM: Cycle Description ==================== -->
  <g filter="url(#cardShadow)" transform="translate(40, 430)">
    <rect width="820" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
    <rect width="820" height="3" rx="1.5" fill="url(#flowGrad)" y="0"/>
    <text x="410" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Data-flow loop</text>
    <text x="410" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">Session begins: long-term memory → retrieve relevant info → inject into working memory ("recall")</text>
    <text x="410" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">Session ends: working memory → compress into short-term memory → extract what matters → write into long-term memory ("remember")</text>
  </g>

  <!-- ==================== BOTTOM: Analogy ==================== -->
  <g transform="translate(40, 520)">
    <rect width="820" height="44" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="410" y="18" text-anchor="middle" fill="#94a3b8" font-size="10">💡 Analogy with the storage hierarchy: working memory ≈ CPU registers | short-term ≈ RAM | long-term ≈ disk</text>
    <text x="410" y="36" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">Key difference: "relevance" here is semantic, not address-based</text>
  </g>
</svg>