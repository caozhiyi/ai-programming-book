<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="14" fill="url(#bgGrad)"/>

  <text x="400" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">AI engineering maturity model: L0 → L4</text>

  <!-- L0 -->
  <g transform="translate(40, 55)">
    <rect width="140" height="220" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#475569"/>
    <text x="70" y="16" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">L0</text>
    <text x="70" y="44" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">Conversational use</text>
    <text x="70" y="66" text-anchor="middle" fill="#64748b" font-size="8">Casual personal use</text>
    <text x="70" y="82" text-anchor="middle" fill="#64748b" font-size="8">Manual copy-paste</text>
    <text x="70" y="98" text-anchor="middle" fill="#64748b" font-size="8">No spec</text>
    <text x="70" y="114" text-anchor="middle" fill="#64748b" font-size="8">No evaluation</text>
    <text x="70" y="130" text-anchor="middle" fill="#64748b" font-size="8">No memory</text>
    <rect x="10" y="150" width="120" height="20" rx="4" fill="#334155"/>
    <text x="70" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">Bottleneck: tool integration</text>
    <rect x="10" y="180" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="10" y="180" width="24" height="8" rx="4" fill="#64748b"/>
  </g>

  <!-- L1 -->
  <g transform="translate(190, 55)">
    <rect width="140" height="220" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#0e7490"/>
    <text x="70" y="16" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">L1</text>
    <text x="70" y="44" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="600">Agent + basic tools</text>
    <text x="70" y="66" text-anchor="middle" fill="#64748b" font-size="8">Can read code and run commands</text>
    <text x="70" y="82" text-anchor="middle" fill="#64748b" font-size="8">Inconsistent output style</text>
    <text x="70" y="98" text-anchor="middle" fill="#64748b" font-size="8">Re-explained every time</text>
    <text x="70" y="114" text-anchor="middle" fill="#64748b" font-size="8">Mostly relies on human fallback</text>
    <text x="70" y="130" text-anchor="middle" fill="#64748b" font-size="8">Quality is unknown</text>
    <rect x="10" y="150" width="120" height="20" rx="4" fill="#334155"/>
    <text x="70" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">Bottleneck: spec building</text>
    <rect x="10" y="180" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="10" y="180" width="48" height="8" rx="4" fill="#06b6d4"/>
  </g>

  <!-- L2 -->
  <g transform="translate(340, 55)">
    <rect width="140" height="220" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#6d28d9"/>
    <text x="70" y="16" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">L2</text>
    <text x="70" y="44" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">Spec + knowledge injection</text>
    <text x="70" y="66" text-anchor="middle" fill="#64748b" font-size="8">Skill/spec takes effect</text>
    <text x="70" y="82" text-anchor="middle" fill="#64748b" font-size="8">Consistent output style</text>
    <text x="70" y="98" text-anchor="middle" fill="#64748b" font-size="8">Knowledge-base integration</text>
    <text x="70" y="114" text-anchor="middle" fill="#64748b" font-size="8">How the memory system works</text>
    <text x="70" y="130" text-anchor="middle" fill="#64748b" font-size="8">Quality starts to stabilize</text>
    <rect x="10" y="150" width="120" height="20" rx="4" fill="#334155"/>
    <text x="70" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">Bottleneck: evaluation system</text>
    <rect x="10" y="180" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="10" y="180" width="72" height="8" rx="4" fill="#8b5cf6"/>
  </g>

  <!-- L3 -->
  <g transform="translate(490, 55)">
    <rect width="140" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#d97706"/>
    <text x="70" y="16" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">L3</text>
    <text x="70" y="44" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Evaluation + observability</text>
    <text x="70" y="66" text-anchor="middle" fill="#64748b" font-size="8">Build the evaluation set</text>
    <text x="70" y="82" text-anchor="middle" fill="#64748b" font-size="8">Production-metric monitoring</text>
    <text x="70" y="98" text-anchor="middle" fill="#64748b" font-size="8">Issues can be traced</text>
    <text x="70" y="114" text-anchor="middle" fill="#64748b" font-size="8">Quality is quantifiable</text>
    <text x="70" y="130" text-anchor="middle" fill="#64748b" font-size="8">Regression-test automation</text>
    <rect x="10" y="150" width="120" height="20" rx="4" fill="#334155"/>
    <text x="70" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">Bottleneck: organizational governance</text>
    <rect x="10" y="180" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="10" y="180" width="96" height="8" rx="4" fill="#f59e0b"/>
  </g>

  <!-- L4 -->
  <g transform="translate(640, 55)">
    <rect width="140" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#059669"/>
    <text x="70" y="16" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">L4</text>
    <text x="70" y="44" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">Team-level AI engineering</text>
    <text x="70" y="66" text-anchor="middle" fill="#64748b" font-size="8">Full governance pipeline</text>
    <text x="70" y="82" text-anchor="middle" fill="#64748b" font-size="8">Model-upgrade management</text>
    <text x="70" y="98" text-anchor="middle" fill="#64748b" font-size="8">Clear security boundaries</text>
    <text x="70" y="114" text-anchor="middle" fill="#64748b" font-size="8">Continuous-evolution mechanism</text>
    <text x="70" y="130" text-anchor="middle" fill="#64748b" font-size="8">Asset version control</text>
    <rect x="10" y="150" width="120" height="20" rx="4" fill="#334155"/>
    <text x="70" y="164" text-anchor="middle" fill="#94a3b8" font-size="7">Target state</text>
    <rect x="10" y="180" width="120" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Bottom note -->
  <g transform="translate(60, 295)">
    <text x="340" y="14" text-anchor="middle" fill="#64748b" font-size="9">💡 Most teams capture significant value just by going from L0 to L2. You don't need to leap straight to the top — get the basics solid first.</text>
  </g>
</svg>
