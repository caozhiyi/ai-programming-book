<g transform="translate(30, 1140)"><rect width="860" height="86" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" opacity="0.8"/><text x="430" y="20" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Key takeaways</text><text x="430" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">The LLM only decides (it emits Function Call JSON) and executes nothing; the Client routes, the Server executes.</text><text x="430" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">list_changed only says the list changed, with no content; the Client must call tools/list again. ttlMs and the notification are complementary.</text><text x="430" y="76" text-anchor="middle" fill="#64748b" font-size="10">Whether it subscribes to and handles the notification depends on the Client; changed descriptions change the context prefix and invalidate the cache (Chapter 9).</text></g>
