<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="lcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Choosing among three knowledge-injection paths</text>
  <text x="400" y="52" text-anchor="middle" fill="#64748b" font-size="11">Choose the path based on how often the knowledge changes, what type it is, and how much there is</text>

  <!-- Decision flow -->
  <!-- Question 1 -->
  <g transform="translate(280, 72)">
    <rect width="240" height="40" rx="20" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">❶ How often does it change?</text>
  </g>

  <!-- High frequency → RAG -->
  <line x1="400" y1="112" x2="160" y2="150" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrowCyan2)"/>
  <text x="260" y="126" fill="#67e8f9" font-size="9">High-frequency (daily/weekly)</text>

  <g transform="translate(60, 148)">
    <rect width="200" height="50" rx="10" fill="url(#ragGrad)" opacity="0.85"/>
    <text x="100" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">→ RAG</text>
    <text x="100" y="40" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Update doc → re-embed → live shortly</text>
  </g>

  <!-- Low frequency → Question 2 -->
  <line x1="400" y1="112" x2="400" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray2)"/>
  <text x="440" y="136" fill="#94a3b8" font-size="9">Low-frequency / one-off</text>

  <!-- Question 2 -->
  <g transform="translate(280, 156)">
    <rect width="240" height="40" rx="20" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">❷ What type of knowledge?</text>
  </g>

  <!-- Facts → RAG -->
  <line x1="340" y1="196" x2="160" y2="230" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrowCyan2)"/>
  <text x="230" y="210" fill="#67e8f9" font-size="9">Factual (API params, configs)</text>

  <g transform="translate(60, 228)">
    <rect width="200" height="50" rx="10" fill="url(#ragGrad)" opacity="0.85"/>
    <text x="100" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">→ RAG</text>
    <text x="100" y="40" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Precise retrieval, on-demand injection</text>
  </g>

  <!-- Patterns → Fine-tuning -->
  <line x1="400" y1="196" x2="640" y2="230" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
  <text x="540" y="210" fill="#fbbf24" font-size="9">Behavioral patterns (style, format, process)</text>

  <g transform="translate(540, 228)">
    <rect width="200" height="50" rx="10" fill="url(#ftGrad)" opacity="0.85"/>
    <text x="100" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">→ fine-tuning</text>
    <text x="100" y="40" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Internalized as the model's "instinct"</text>
  </g>

  <!-- Question 3 -->
  <g transform="translate(280, 240)">
    <rect width="240" height="40" rx="20" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">❸ How much knowledge?</text>
  </g>

  <!-- Connection from Q2 to Q3 -->
  <line x1="400" y1="196" x2="400" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray2)"/>
  <text x="440" y="222" fill="#94a3b8" font-size="9">Full context</text>

  <!-- Small → Long context -->
  <line x1="340" y1="280" x2="160" y2="314" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="230" y="296" fill="#a78bfa" font-size="9">Fits in the window (&lt; 128K)</text>

  <g transform="translate(60, 312)">
    <rect width="200" height="50" rx="10" fill="url(#lcGrad)" opacity="0.85"/>
    <text x="100" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">→ long context</text>
    <text x="100" y="40" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Simple and direct — fits one-off tasks</text>
  </g>

  <!-- Large → RAG -->
  <line x1="460" y1="280" x2="640" y2="314" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrowCyan2)"/>
  <text x="570" y="296" fill="#67e8f9" font-size="9">Won't fit in the window (> 128K)</text>

  <g transform="translate(540, 312)">
    <rect width="200" height="50" rx="10" fill="url(#ragGrad)" opacity="0.85"/>
    <text x="100" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">→ RAG</text>
    <text x="100" y="40" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">The only way to handle knowledge at scale</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(40, 380)">
    <rect width="720" height="30" rx="8" fill="#1e293b" opacity="0.6"/>
    <rect x="14" y="9" width="12" height="12" rx="2" fill="url(#ragGrad)"/>
    <text x="32" y="19" fill="#94a3b8" font-size="10">RAG: live knowledge</text>
    <rect x="160" y="9" width="12" height="12" rx="2" fill="url(#ftGrad)"/>
    <text x="178" y="19" fill="#94a3b8" font-size="10">Fine-tuning: foundational ability</text>
    <rect x="360" y="9" width="12" height="12" rx="2" fill="url(#lcGrad)"/>
    <text x="378" y="19" fill="#94a3b8" font-size="10">Long context: current input</text>
    <text x="708" y="19" text-anchor="end" fill="#64748b" font-size="9" font-style="italic">Often used together</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#a78bfa"/>
    </marker>
  </defs>
</svg>
