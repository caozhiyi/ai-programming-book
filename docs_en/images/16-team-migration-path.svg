<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="350" rx="14" fill="url(#bgGrad)"/>

  <text x="400" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Team migration path: key actions and risks from L0 to L4</text>

  <!-- Timeline arrow -->
  <line x1="40" y1="170" x2="770" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L0 -->
  <g transform="translate(55, 80)">
    <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">L0</text>
    <text x="60" y="38" text-anchor="middle" fill="#64748b" font-size="9">Conversational use</text>
    <text x="60" y="52" text-anchor="middle" fill="#475569" font-size="8">Casual personal exploration</text>
    <text x="60" y="64" text-anchor="middle" fill="#475569" font-size="8">No spec, no evaluation</text>
  </g>
  <circle cx="115" cy="170" r="5" fill="#64748b"/>

  <!-- Arrow L0→L1 -->
  <g transform="translate(100, 195)">
    <text x="50" y="12" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="600">🔑 Set up Agent env</text>
    <text x="50" y="24" text-anchor="middle" fill="#475569" font-size="7">⚠️ Inflated expectations</text>
  </g>

  <!-- L1 -->
  <g transform="translate(195, 80)">
    <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">L1</text>
    <text x="60" y="38" text-anchor="middle" fill="#64748b" font-size="9">Single Agent + tools</text>
    <text x="60" y="52" text-anchor="middle" fill="#475569" font-size="8">Can read and write code</text>
    <text x="60" y="64" text-anchor="middle" fill="#475569" font-size="8">Inconsistent style</text>
  </g>
  <circle cx="255" cy="170" r="5" fill="#06b6d4"/>

  <!-- Arrow L1→L2 -->
  <g transform="translate(240, 195)">
    <text x="50" y="12" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="600">🔑 Add specs + memory</text>
    <text x="50" y="24" text-anchor="middle" fill="#475569" font-size="7">⚠️ Conflicting specs</text>
  </g>

  <!-- L2 -->
  <g transform="translate(335, 80)">
    <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">L2</text>
    <text x="60" y="38" text-anchor="middle" fill="#64748b" font-size="9">Has specs and knowledge</text>
    <text x="60" y="52" text-anchor="middle" fill="#475569" font-size="8">Consistent output style</text>
    <text x="60" y="64" text-anchor="middle" fill="#475569" font-size="8">Quality can't be quantified</text>
  </g>
  <circle cx="395" cy="170" r="5" fill="#8b5cf6"/>

  <!-- Arrow L2→L3 -->
  <g transform="translate(380, 195)">
    <text x="50" y="12" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="600">🔑 Add eval + tracing</text>
    <text x="50" y="24" text-anchor="middle" fill="#475569" font-size="7">⚠️ Stale eval set</text>
  </g>

  <!-- L3 -->
  <g transform="translate(475, 80)">
    <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">L3</text>
    <text x="60" y="38" text-anchor="middle" fill="#64748b" font-size="9">Has eval and monitoring</text>
    <text x="60" y="52" text-anchor="middle" fill="#475569" font-size="8">Quality is quantifiable</text>
    <text x="60" y="64" text-anchor="middle" fill="#475569" font-size="8">Issues can be traced</text>
  </g>
  <circle cx="535" cy="170" r="5" fill="#10b981"/>

  <!-- Arrow L3→L4 -->
  <g transform="translate(520, 195)">
    <text x="50" y="12" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="600">🔑 Versioning + reviews</text>
    <text x="50" y="24" text-anchor="middle" fill="#475569" font-size="7">⚠️ Over-centralization</text>
  </g>

  <!-- L4 -->
  <g transform="translate(615, 80)">
    <rect width="140" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">L4</text>
    <text x="70" y="38" text-anchor="middle" fill="#64748b" font-size="9">Team-level AI engineering</text>
    <text x="70" y="52" text-anchor="middle" fill="#475569" font-size="8">Full governance pipeline</text>
    <text x="70" y="64" text-anchor="middle" fill="#475569" font-size="8">Continuous-evolution mechanism</text>
  </g>
  <circle cx="685" cy="170" r="5" fill="#f59e0b"/>

  <!-- Bottom note -->
  <g transform="translate(100, 260)">
    <rect width="600" height="60" rx="8" fill="#1e293b" opacity="0.4" stroke="#334155" stroke-width="0.5"/>
    <text x="300" y="18" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">💡 Key insight</text>
    <text x="300" y="35" text-anchor="middle" fill="#64748b" font-size="9">Most teams capture significant value just going from L0 → L2</text>
    <text x="300" y="50" text-anchor="middle" fill="#64748b" font-size="9">L3/L4 only matter once you depend on AI output quality and need systematic governance</text>
  </g>
</svg>
