<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="transportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="16" fill="url(#bgGrad)"/>
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="620" stroke="#fff"/>
    <line x1="180" y1="0" x2="180" y2="620" stroke="#fff"/>
    <line x1="300" y1="0" x2="300" y2="620" stroke="#fff"/>
    <line x1="420" y1="0" x2="420" y2="620" stroke="#fff"/>
    <line x1="540" y1="0" x2="540" y2="620" stroke="#fff"/>
    <line x1="660" y1="0" x2="660" y2="620" stroke="#fff"/>
    <line x1="780" y1="0" x2="780" y2="620" stroke="#fff"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">MCP three-layer architecture</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">Model Context Protocol — standardized discovery and invocation of tools</text>

  <!-- ==================== AGENT (Top Center) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(310, 85)">
    <rect width="280" height="80" rx="14" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect width="280" height="4" rx="2" fill="url(#agentGrad)" y="0"/>
    <g transform="translate(16, 18)">
      <circle cx="14" cy="14" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="18" text-anchor="middle" fill="#f59e0b" font-size="14">🤖</text>
    </g>
    <text x="52" y="30" fill="#e2e8f0" font-size="16" font-weight="700">Agent (LLM)</text>
    <text x="52" y="48" fill="#94a3b8" font-size="10">Expresses intent via Function Calling</text>
    <text x="52" y="64" fill="#64748b" font-size="9" font-style="italic">Emits a JSON request — performs no action</text>
  </g>

  <!-- Arrow: Agent → Client -->
  <line x1="450" y1="167" x2="450" y2="205" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="465" y="190" fill="#f59e0b" font-size="9" opacity="0.7">Function Call JSON</text>

  <!-- ==================== MCP CLIENT (Middle) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(250, 208)">
    <rect width="400" height="100" rx="14" fill="#0f1a33" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
    <rect width="400" height="4" rx="2" fill="url(#clientGrad)" y="0"/>
    <g transform="translate(16, 16)">
      <circle cx="14" cy="14" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="14" y="19" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">C</text>
    </g>
    <text x="52" y="28" fill="#e2e8f0" font-size="16" font-weight="700">MCP Client</text>
    <text x="160" y="28" fill="#64748b" font-size="10">(tool manager)</text>
    <text x="16" y="50" fill="#94a3b8" font-size="10">① Connect to Server, fetch the tool list</text>
    <text x="16" y="66" fill="#94a3b8" font-size="10">② Inject tool descriptions into the Agent's context</text>
    <text x="16" y="82" fill="#94a3b8" font-size="10">③ Route the call to the right Server, return the result</text>
  </g>

  <!-- ==================== TRANSPORT LAYER ==================== -->
  <g transform="translate(250, 325)">
    <rect width="400" height="36" rx="8" fill="#06b6d4" fill-opacity="0.06" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="200" y="14" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">Transport layer (protocol)</text>
    <g transform="translate(40, 20)">
      <rect width="80" height="14" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="40" y="10" text-anchor="middle" fill="#06b6d4" font-size="8" font-weight="600">stdio (local)</text>
    </g>
    <g transform="translate(160, 20)">
      <rect width="80" height="14" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="40" y="10" text-anchor="middle" fill="#06b6d4" font-size="8" font-weight="600">Streamable HTTP</text>
    </g>
    <g transform="translate(280, 20)">
      <rect width="80" height="14" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="40" y="10" text-anchor="middle" fill="#06b6d4" font-size="8" font-weight="600">Extensible</text>
    </g>
  </g>

  <!-- Arrows: Client ↔ Transport -->
  <line x1="400" y1="310" x2="400" y2="323" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <line x1="500" y1="310" x2="500" y2="323" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.6"/>

  <!-- Arrows: Transport → Servers -->
  <line x1="330" y1="363" x2="160" y2="410" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.7"/>
  <line x1="450" y1="363" x2="450" y2="410" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.7"/>
  <line x1="570" y1="363" x2="740" y2="410" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)" opacity="0.7"/>

  <!-- ==================== MCP SERVERS (Bottom) ==================== -->
  <!-- Server 1: File System -->
  <g filter="url(#cardShadow)" transform="translate(40, 415)">
    <rect width="230" height="110" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="230" height="4" rx="2" fill="url(#serverGrad)" y="0"/>
    <g transform="translate(14, 14)">
      <circle cx="12" cy="12" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">S</text>
    </g>
    <text x="44" y="24" fill="#e2e8f0" font-size="13" font-weight="700">Filesystem Server</text>
    <line x1="14" y1="36" x2="216" y2="36" stroke="#2a1a4a" stroke-width="0.8"/>
    <!-- Tools -->
    <g transform="translate(14, 44)">
      <rect width="64" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="32" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">read_file</text>
    </g>
    <g transform="translate(84, 44)">
      <rect width="64" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="32" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">write_file</text>
    </g>
    <g transform="translate(154, 44)">
      <rect width="64" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="32" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">list_dir</text>
    </g>
    <text x="14" y="84" fill="#64748b" font-size="9">📁 Resources: project file tree</text>
    <text x="14" y="98" fill="#64748b" font-size="9">📝 Prompts: file-operation best practices</text>
  </g>

  <!-- Server 2: Code Search -->
  <g filter="url(#cardShadow)" transform="translate(335, 415)">
    <rect width="230" height="110" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="230" height="4" rx="2" fill="url(#serverGrad)" y="0"/>
    <g transform="translate(14, 14)">
      <circle cx="12" cy="12" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">S</text>
    </g>
    <text x="44" y="24" fill="#e2e8f0" font-size="13" font-weight="700">Code-search Server</text>
    <line x1="14" y1="36" x2="216" y2="36" stroke="#2a1a4a" stroke-width="0.8"/>
    <g transform="translate(14, 44)">
      <rect width="80" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="40" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">semantic_search</text>
    </g>
    <g transform="translate(100, 44)">
      <rect width="72" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="36" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">grep_search</text>
    </g>
    <text x="14" y="84" fill="#64748b" font-size="9">📁 Resources: code index</text>
    <text x="14" y="98" fill="#64748b" font-size="9">📝 Prompts: search-strategy guide</text>
  </g>

  <!-- Server 3: GitHub -->
  <g filter="url(#cardShadow)" transform="translate(630, 415)">
    <rect width="230" height="110" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="230" height="4" rx="2" fill="url(#serverGrad)" y="0"/>
    <g transform="translate(14, 14)">
      <circle cx="12" cy="12" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">S</text>
    </g>
    <text x="44" y="24" fill="#e2e8f0" font-size="13" font-weight="700">GitHub Server</text>
    <line x1="14" y1="36" x2="216" y2="36" stroke="#2a1a4a" stroke-width="0.8"/>
    <g transform="translate(14, 44)">
      <rect width="72" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="36" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">create_issue</text>
    </g>
    <g transform="translate(92, 44)">
      <rect width="72" height="20" rx="5" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="36" y="14" text-anchor="middle" fill="#a78bfa" font-size="8">list_PRs</text>
    </g>
    <text x="14" y="84" fill="#64748b" font-size="9">📁 Resources: repo metadata</text>
    <text x="14" y="98" fill="#64748b" font-size="9">📝 Prompts: PR-review template</text>
  </g>

  <!-- ==================== RIGHT SIDE: Three Primitives Legend ==================== -->
  <g transform="translate(690, 90)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85"/>
    <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Three Server-side primitives</text>
    <line x1="12" y1="28" x2="168" y2="28" stroke="#334155" stroke-width="0.8"/>
    <g transform="translate(12, 36)">
      <rect width="12" height="12" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="20" y="10" fill="#f59e0b" font-size="10" font-weight="600">Tools</text>
      <text x="60" y="10" fill="#64748b" font-size="9">Executable actions</text>
    </g>
    <g transform="translate(12, 58)">
      <rect width="12" height="12" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="20" y="10" fill="#3b82f6" font-size="10" font-weight="600">Resources</text>
      <text x="80" y="10" fill="#64748b" font-size="9">Readable data</text>
    </g>
    <g transform="translate(12, 80)">
      <rect width="12" height="12" rx="3" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
      <text x="20" y="10" fill="#10b981" font-size="10" font-weight="600">Prompts</text>
      <text x="72" y="10" fill="#64748b" font-size="9">Interaction templates</text>
    </g>
    <text x="12" y="108" fill="#475569" font-size="8" font-style="italic">Capability = tools + context + usage</text>
  </g>

  <!-- ==================== LEFT SIDE: vs Function Calling ==================== -->
  <g transform="translate(30, 90)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85"/>
    <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">MCP vs Function Calling</text>
    <line x1="12" y1="28" x2="168" y2="28" stroke="#334155" stroke-width="0.8"/>
    <text x="12" y="44" fill="#f59e0b" font-size="9" font-weight="600">Function Calling</text>
    <text x="12" y="56" fill="#64748b" font-size="9">The model's "mouth" — intent</text>
    <text x="12" y="68" fill="#64748b" font-size="9">Static, fixed at compile time</text>
    <line x1="12" y1="76" x2="168" y2="76" stroke="#334155" stroke-width="0.5"/>
    <text x="12" y="88" fill="#3b82f6" font-size="9" font-weight="600">MCP</text>
    <text x="12" y="100" fill="#64748b" font-size="9">The "nervous system" — routing</text>
    <text x="12" y="112" fill="#64748b" font-size="9">Dynamic discovery at runtime</text>
  </g>

  <!-- ==================== BOTTOM: Flow Summary ==================== -->
  <g transform="translate(40, 545)">
    <rect width="820" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.6"/>
    <text x="410" y="16" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">End-to-end call flow</text>
    <g transform="translate(10, 26)">
      <text x="0" y="12" fill="#8b5cf6" font-size="9">Server exposes tools</text>
      <text x="94" y="12" fill="#475569" font-size="10">→</text>
      <text x="108" y="12" fill="#3b82f6" font-size="9">Client fetches list</text>
      <text x="194" y="12" fill="#475569" font-size="10">→</text>
      <text x="208" y="12" fill="#f59e0b" font-size="9">Inject into context</text>
      <text x="294" y="12" fill="#475569" font-size="10">→</text>
      <text x="308" y="12" fill="#f59e0b" font-size="9">Agent calls tool</text>
      <text x="384" y="12" fill="#475569" font-size="10">→</text>
      <text x="398" y="12" fill="#3b82f6" font-size="9">Client routes</text>
      <text x="460" y="12" fill="#475569" font-size="10">→</text>
      <text x="474" y="12" fill="#8b5cf6" font-size="9">Server executes</text>
      <text x="548" y="12" fill="#475569" font-size="10">→</text>
      <text x="562" y="12" fill="#10b981" font-size="9">Result back to context</text>
    </g>
  </g>
</svg>