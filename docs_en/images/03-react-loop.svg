<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="observeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="thinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="arrowGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="arrowGrad4" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glowShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="750" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="900" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="900" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="900" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="900" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="540" x2="900" y2="540" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="900" y2="600" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="660" x2="900" y2="660" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="720" x2="900" y2="720" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Decorative glow circles -->
  <circle cx="450" cy="340" r="200" fill="url(#glowGrad)" opacity="0.4"/>
  <circle cx="450" cy="340" r="140" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.15"/>
  <circle cx="450" cy="340" r="180" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 6"/>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">ReAct loop: reasoning and action interleaved</text>
  <text x="450" y="76" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">Reasoning + Acting — the core execution pattern of an Agent</text>

  <!-- ==================== STEP 1: OBSERVE (Top) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(310, 100)">
    <!-- Card background -->
    <rect width="280" height="100" rx="16" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <!-- Accent bar -->
    <rect width="280" height="4" rx="2" fill="url(#observeGrad)" y="0"/>
    <!-- Step number badge -->
    <circle cx="36" cy="40" r="18" fill="url(#observeGrad)" opacity="0.9"/>
    <text x="36" y="45" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
    <!-- Icon: eye -->
    <g transform="translate(22, 58)" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round">
      <path d="M0 8 C5 0, 23 0, 28 8 C23 16, 5 16, 0 8Z"/>
      <circle cx="14" cy="8" r="4" fill="#06b6d4" fill-opacity="0.3"/>
    </g>
    <!-- Text -->
    <text x="68" y="38" fill="#e2e8f0" font-size="17" font-weight="700">Observe</text>
    <text x="68" y="58" fill="#94a3b8" font-size="11">Read the current context</text>
    <text x="68" y="76" fill="#64748b" font-size="10" font-style="italic">Task + prior results + tool output</text>
  </g>

  <!-- ==================== STEP 2: THINK (Right) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(590, 260)">
    <rect width="280" height="100" rx="16" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="280" height="4" rx="2" fill="url(#thinkGrad)" y="0"/>
    <circle cx="36" cy="40" r="18" fill="url(#thinkGrad)" opacity="0.9"/>
    <text x="36" y="45" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
    <!-- Icon: brain/lightbulb -->
    <g transform="translate(24, 58)" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round">
      <path d="M14 0 C6 0, 0 6, 0 12 C0 16, 4 19, 6 22 L22 22 C24 19, 28 16, 28 12 C28 6, 22 0, 14 0Z"/>
      <line x1="8" y1="25" x2="20" y2="25"/>
      <line x1="10" y1="28" x2="18" y2="28"/>
    </g>
    <text x="68" y="38" fill="#e2e8f0" font-size="17" font-weight="700">Think (Reason)</text>
    <text x="68" y="58" fill="#94a3b8" font-size="11">Predict the next action</text>
    <text x="68" y="76" fill="#64748b" font-size="10" font-style="italic">Probabilistic, not logical reasoning</text>
  </g>

  <!-- ==================== STEP 3: ACT (Bottom) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(310, 420)">
    <rect width="280" height="100" rx="16" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect width="280" height="4" rx="2" fill="url(#actGrad)" y="0"/>
    <circle cx="36" cy="40" r="18" fill="url(#actGrad)" opacity="0.9"/>
    <text x="36" y="45" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
    <!-- Icon: lightning bolt -->
    <g transform="translate(26, 58)" fill="#f59e0b" fill-opacity="0.8" stroke="none">
      <polygon points="14 0, 4 14, 12 14, 10 26, 22 10, 14 10"/>
    </g>
    <text x="68" y="38" fill="#e2e8f0" font-size="17" font-weight="700">Act</text>
    <text x="68" y="58" fill="#94a3b8" font-size="11">Emit a function call</text>
    <text x="68" y="76" fill="#64748b" font-size="10" font-style="italic">Model emits JSON → system runs it</text>
  </g>

  <!-- ==================== STEP 4: RESULT (Left) ==================== -->
  <g filter="url(#cardShadow)" transform="translate(30, 260)">
    <rect width="280" height="100" rx="16" fill="#0a1f1a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <rect width="280" height="4" rx="2" fill="url(#resultGrad)" y="0"/>
    <circle cx="36" cy="40" r="18" fill="url(#resultGrad)" opacity="0.9"/>
    <text x="36" y="45" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4</text>
    <!-- Icon: clipboard/result -->
    <g transform="translate(24, 58)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round">
      <rect x="2" y="4" width="24" height="22" rx="3"/>
      <rect x="8" y="0" width="12" height="8" rx="2"/>
      <line x1="8" y1="14" x2="20" y2="14"/>
      <line x1="8" y1="19" x2="16" y2="19"/>
    </g>
    <text x="68" y="38" fill="#e2e8f0" font-size="17" font-weight="700">Observe (Result)</text>
    <text x="68" y="58" fill="#94a3b8" font-size="11">Tool result feeds back in</text>
    <text x="68" y="76" fill="#64748b" font-size="10" font-style="italic">New info becomes the next input</text>
  </g>

  <!-- ==================== CENTER: while loop ==================== -->
  <g filter="url(#softGlow)">
    <circle cx="450" cy="310" r="48" fill="url(#centerGrad)" opacity="0.15"/>
    <circle cx="450" cy="310" r="38" fill="url(#centerGrad)" opacity="0.9"/>
    <text x="450" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">while</text>
    <text x="450" y="321" text-anchor="middle" fill="#dbeafe" font-size="10">Incomplete</text>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Arrow 1→2: Observe → Think (top-right curve) -->
  <path d="M 590 155 Q 650 155, 690 260" fill="none" stroke="url(#arrowGrad1)" stroke-width="2.5" marker-end="url(#arrowPurple)" stroke-linecap="round"/>
  <!-- Data type annotation -->
  <g transform="translate(644, 190)">
    <rect width="112" height="18" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.6" opacity="0.9"/>
    <text x="56" y="13" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">string (context text)</text>
  </g>

  <!-- Arrow 2→3: Think → Act (right-bottom curve) -->
  <path d="M 690 360 Q 650 420, 590 465" fill="none" stroke="url(#arrowGrad2)" stroke-width="2.5" marker-end="url(#arrowAmber)" stroke-linecap="round"/>
  <!-- Data type annotation -->
  <g transform="translate(648, 400)">
    <rect width="108" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.6" opacity="0.9"/>
    <text x="54" y="13" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">JSON (tool_call)</text>
  </g>

  <!-- Arrow 3→4: Act → Result (bottom-left curve) -->
  <path d="M 310 465 Q 250 420, 210 360" fill="none" stroke="url(#arrowGrad3)" stroke-width="2.5" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <!-- Data type annotation -->
  <g transform="translate(144, 400)">
    <rect width="116" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.6" opacity="0.9"/>
    <text x="58" y="13" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">string (exec result)</text>
  </g>

  <!-- Arrow 4→1: Result → Observe (left-top curve) -->
  <path d="M 210 260 Q 250 155, 310 155" fill="none" stroke="url(#arrowGrad4)" stroke-width="2.5" marker-end="url(#arrowCyan)" stroke-linecap="round"/>
  <!-- Data type annotation -->
  <g transform="translate(148, 190)">
    <rect width="108" height="18" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="0.6" opacity="0.9"/>
    <text x="54" y="13" text-anchor="middle" fill="#67e8f9" font-size="8" font-family="monospace">Append to messages[]</text>
  </g>

  <!-- ==================== EXIT PATH ==================== -->
  <!-- Exit arrow from right side of center, curving down to avoid Act card -->
  <path d="M 490 340 Q 540 400, 540 540 Q 540 580, 500 600" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)" opacity="0.8"/>

  <!-- Exit condition label - positioned clearly below Act card -->
  <text x="558" y="490" fill="#ef4444" font-size="11" opacity="0.7" font-style="italic">Done?</text>
  <text x="558" y="505" fill="#ef4444" font-size="11" opacity="0.7" font-style="italic">Or step cap reached?</text>

  <!-- Exit card -->
  <g filter="url(#cardShadow)" transform="translate(340, 610)">
    <rect width="220" height="52" rx="12" fill="#1a0f0f" stroke="#ef4444" stroke-width="1.2" opacity="0.9"/>
    <rect width="220" height="3" rx="1.5" fill="#ef4444" y="0"/>
    <!-- Icon: stop -->
    <g transform="translate(16, 14)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="none" stroke="#ef4444" stroke-width="1.8"/>
      <rect x="6" y="6" width="12" height="12" rx="2" fill="#ef4444" fill-opacity="0.5"/>
    </g>
    <text x="52" y="24" fill="#fca5a5" font-size="12" font-weight="600">Done / step cap reached</text>
    <text x="52" y="40" fill="#64748b" font-size="10">Emit final result, exit the loop</text>
  </g>

  <!-- ==================== ANNOTATIONS ==================== -->
  <!-- Right side annotation: context growth -->
  <g transform="translate(720, 430)">
    <rect width="160" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85"/>
    <text x="14" y="22" fill="#f59e0b" font-size="11" font-weight="600">⚠ Context bloat</text>
    <text x="14" y="38" fill="#94a3b8" font-size="10">Every loop eats more</text>
    <text x="14" y="52" fill="#94a3b8" font-size="10">context-window space</text>
    <text x="14" y="68" fill="#64748b" font-size="9" font-style="italic">An implicit step cap exists</text>
  </g>
  <!-- Connector line -->
  <line x1="720" y1="470" x2="592" y2="470" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Left side annotation: probability -->
  <g transform="translate(20, 430)">
    <rect width="160" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85"/>
    <text x="14" y="22" fill="#8b5cf6" font-size="11" font-weight="600">🎲 Probabilistic step</text>
    <text x="14" y="38" fill="#94a3b8" font-size="10">Every "thought" is a</text>
    <text x="14" y="52" fill="#94a3b8" font-size="10">token-probability draw</text>
    <text x="14" y="68" fill="#64748b" font-size="9" font-style="italic">May pick wrong tool or args</text>
  </g>
  <!-- Connector line -->
  <line x1="180" y1="470" x2="308" y2="470" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(30, 690)">
    <rect width="840" height="44" rx="8" fill="#1e293b" opacity="0.6"/>
    <circle cx="24" cy="22" r="6" fill="#06b6d4"/>
    <text x="38" y="26" fill="#94a3b8" font-size="11">Observe</text>
    <circle cx="104" cy="22" r="6" fill="#8b5cf6"/>
    <text x="118" y="26" fill="#94a3b8" font-size="11">Think</text>
    <circle cx="184" cy="22" r="6" fill="#f59e0b"/>
    <text x="198" y="26" fill="#94a3b8" font-size="11">Act</text>
    <circle cx="264" cy="22" r="6" fill="#10b981"/>
    <text x="278" y="26" fill="#94a3b8" font-size="11">Result</text>
    <line x1="340" y1="22" x2="370" y2="22" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="378" y="26" fill="#94a3b8" font-size="11">Exit path</text>
    <text x="620" y="26" fill="#475569" font-size="10" font-style="italic">At its core: a while-loop + a probabilistic predictor</text>
  </g>
</svg>