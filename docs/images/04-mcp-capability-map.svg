<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/></linearGradient><linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8b5cf6"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient><linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3b82f6"/><stop offset="100%" style="stop-color:#2563eb"/></linearGradient><filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter><marker id="aS" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker><marker id="aC" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ec4899"/></marker></defs>
<rect width="920" height="640" rx="16" fill="url(#bgGrad)"/>
<text x="460" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">MCP 能力图谱</text>
<text x="460" y="64" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">核心原语 · 客户端能力 · 扩展机制（2026-07-28 版）</text>
<g filter="url(#cardShadow)" transform="translate(30, 100)">
<rect width="320" height="330" rx="16" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
<rect width="320" height="4" rx="2" fill="url(#serverGrad)"/>
<g transform="translate(20, 18)"><circle cx="16" cy="16" r="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2"/><text x="16" y="21" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="700">S</text></g>
<text x="58" y="33" fill="#e2e8f0" font-size="17" font-weight="700">MCP Server</text>
<text x="58" y="51" fill="#94a3b8" font-size="10">向 Client 暴露：能做什么 / 能看什么 / 有哪些模板</text>
<line x1="20" y1="66" x2="300" y2="66" stroke="#334155" stroke-width="0.8"/>
<g transform="translate(18, 80)" opacity="1">
<rect width="284" height="66" rx="10" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="0.9"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8"/>
<text x="30" y="20" fill="#f59e0b" font-size="12" font-weight="700">Tools</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">模型决定调用，有副作用</text>
<text x="12" y="55" fill="#64748b" font-size="9">read_file · search_code · run_command · create_issue</text>
</g>
<g transform="translate(18, 156)" opacity="1">
<rect width="284" height="66" rx="10" fill="#3b82f6" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="0.9"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="0.8"/>
<text x="30" y="20" fill="#3b82f6" font-size="12" font-weight="700">Resources</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">应用决定带入，不要求提前加载</text>
<text x="12" y="55" fill="#64748b" font-size="9">架构文档 · 数据库 Schema · API 文档 · 配置</text>
</g>
<g transform="translate(18, 232)" opacity="1">
<rect width="284" height="66" rx="10" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.6" stroke-width="0.9"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
<text x="30" y="20" fill="#10b981" font-size="12" font-weight="700">Prompts</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">用户显式选用，如斜杠命令</text>
<text x="12" y="55" fill="#64748b" font-size="9">code_review · data_analysis · 故障排查模板</text>
</g>
</g>
<g filter="url(#cardShadow)" transform="translate(570, 100)">
<rect width="320" height="330" rx="16" fill="#0f1a33" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
<rect width="320" height="4" rx="2" fill="url(#clientGrad)"/>
<g transform="translate(20, 18)"><circle cx="16" cy="16" r="16" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/><text x="16" y="21" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">C</text></g>
<text x="58" y="33" fill="#e2e8f0" font-size="17" font-weight="700">MCP Client</text>
<text x="58" y="51" fill="#94a3b8" font-size="10">向 Server 暴露：运行中可以向用户追问</text>
<line x1="20" y1="66" x2="300" y2="66" stroke="#334155" stroke-width="0.8"/>
<g transform="translate(18, 80)" opacity="1">
<rect width="284" height="66" rx="10" fill="#ec4899" fill-opacity="0.07" stroke="#ec4899" stroke-opacity="0.6" stroke-width="0.9"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899" stroke-width="0.8"/>
<text x="30" y="20" fill="#ec4899" font-size="12" font-weight="700">Elicitation</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">运行中向用户追问，请求—重试（MRTR）</text>
<text x="12" y="55" fill="#64748b" font-size="9">表单模式 · URL 模式（敏感信息不经过 Client）</text>
</g>
<g transform="translate(18, 156)" opacity="0.55">
<rect width="284" height="66" rx="10" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="4 3"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#64748b" fill-opacity="0.3" stroke="#64748b" stroke-width="0.8"/>
<text x="30" y="20" fill="#94a3b8" font-size="12" font-weight="700">Roots</text>
<rect x="233" y="8" width="41" height="16" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.6" stroke-width="0.7"/>
<text x="254" y="19.5" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">已弃用</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">声明可访问的工作区</text>
<text x="12" y="55" fill="#64748b" font-size="9">改用：工具参数 · 资源 URI · 服务器配置</text>
</g>
<g transform="translate(18, 232)" opacity="0.55">
<rect width="284" height="66" rx="10" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="4 3"/>
<rect x="10" y="10" width="12" height="12" rx="3" fill="#64748b" fill-opacity="0.3" stroke="#64748b" stroke-width="0.8"/>
<text x="30" y="20" fill="#94a3b8" font-size="12" font-weight="700">Sampling</text>
<rect x="233" y="8" width="41" height="16" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.6" stroke-width="0.7"/>
<text x="254" y="19.5" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">已弃用</text>
<text x="12" y="39" fill="#cbd5e1" font-size="10">让 Server 反请求 Client 的 LLM 推理</text>
<text x="12" y="55" fill="#64748b" font-size="9">改用：Server 直接调用 LLM 提供商 API</text>
</g>
<text x="160.0" y="320" text-anchor="middle" fill="#64748b" font-size="8.5" font-style="italic">Roots、Sampling 弃用期内仍可用，最早 2027-07-28 起可被移除</text>
</g>
<g transform="translate(364, 120)">
<rect width="192" height="46" rx="10" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 3"/>
<text x="96" y="19" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">MCP 协议通道</text>
<text x="96" y="35" text-anchor="middle" fill="#64748b" font-size="8.5">JSON-RPC over stdio / Streamable HTTP</text>
</g>
<line x1="356" y1="230" x2="562" y2="230" stroke="#a78bfa" stroke-width="2" marker-end="url(#aS)"/>
<text x="460" y="218" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Server → Client</text>
<text x="460" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">Tools / Resources / Prompts</text>
<line x1="564" y1="320" x2="358" y2="320" stroke="#ec4899" stroke-width="2" marker-end="url(#aC)"/>
<text x="460" y="308" text-anchor="middle" fill="#ec4899" font-size="10" font-weight="600">Client → Server</text>
<text x="460" y="338" text-anchor="middle" fill="#94a3b8" font-size="9">Elicitation（请求—重试）</text>
<g transform="translate(30, 448)">
<rect width="860" height="86" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5 3"/>
<text x="16" y="22" fill="#06b6d4" font-size="12" font-weight="700">扩展机制：capabilities.extensions</text>
<text x="16" y="38" fill="#64748b" font-size="9">双方按扩展标识符声明可选能力，对方不支持就回退到核心协议</text>
<rect x="16" y="48" width="200" height="28" rx="8" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="28" y="66" fill="#67e8f9" font-size="11" font-weight="700">Tasks</text>
<text x="74" y="66" fill="#94a3b8" font-size="9">原在核心协议，现移出为扩展</text>
<rect x="228" y="48" width="140" height="28" rx="8" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="240" y="66" fill="#67e8f9" font-size="11" font-weight="700">MCP Apps</text>
<rect x="380" y="48" width="300" height="28" rx="8" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="392" y="66" fill="#67e8f9" font-size="11" font-weight="700">Skills</text>
<text x="445" y="66" fill="#94a3b8" font-size="9">skill:// · skills/list · skills/get</text>
<text x="696" y="66" fill="#64748b" font-size="8.5" font-style="italic"></text>
</g>
<text x="460" y="548" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">Skills 扩展用 Resources 运输 Skill 目录，触发方式不变</text>
<g transform="translate(30, 560)">
<rect width="860" height="64" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" opacity="0.8"/>
<text x="430" y="19" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">关键认知</text>
<text x="430" y="37" text-anchor="middle" fill="#94a3b8" font-size="10">三种原语的区别在“谁来决定用”：模型、应用、用户。Client 侧只剩 Elicitation，新能力通过扩展加入。</text>
<text x="430" y="53" text-anchor="middle" fill="#64748b" font-size="10">早期资料里“Server 与 Client 六项对称契约”的说法已不成立，Roots 与 Sampling 自 2026-07-28 起弃用。</text>
</g>
</svg>
