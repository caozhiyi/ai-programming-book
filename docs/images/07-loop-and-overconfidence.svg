<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">两种对立的失败模式</text>
  <text x="440" y="54" text-anchor="middle" fill="#64748b" font-size="11">一个是"不停地试"，一个是"过早地停"——但根因相同</text>

  <!-- Divider -->
  <line x1="440" y1="72" x2="440" y2="330" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: Infinite Loop ===== -->
  <text x="220" y="82" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="700">无限循环</text>
  <text x="220" y="98" text-anchor="middle" fill="#64748b" font-size="10">"不停地试，但走不出来"</text>

  <!-- Plan A box -->
  <g filter="url(#cardShadow)" transform="translate(60, 115)">
    <rect width="140" height="70" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="70" y="22" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">方案 A</text>
    <text x="70" y="40" text-anchor="middle" fill="#94a3b8" font-size="8">修改为 sync.Mutex</text>
    <text x="70" y="56" text-anchor="middle" fill="#ef4444" font-size="8">→ 编译报错 X</text>
  </g>

  <!-- Plan B box -->
  <g filter="url(#cardShadow)" transform="translate(240, 115)">
    <rect width="140" height="70" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="70" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="600">方案 B</text>
    <text x="70" y="40" text-anchor="middle" fill="#94a3b8" font-size="8">改用 sync.RWMutex</text>
    <text x="70" y="56" text-anchor="middle" fill="#ef4444" font-size="8">→ 编译报错 Y</text>
  </g>

  <!-- Circular arrows between A and B -->
  <path d="M 200 122 Q 220 108, 240 122" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 240 178 Q 220 192, 200 178" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="220" y="108" text-anchor="middle" fill="#f59e0b" font-size="7">修复 X</text>
  <text x="220" y="200" text-anchor="middle" fill="#f59e0b" font-size="7">修复 Y</text>

  <!-- Loop counter -->
  <g transform="translate(100, 215)">
    <rect width="240" height="50" rx="8" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-width="0.6"/>
    <text x="120" y="18" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">循环记录</text>
    <text x="120" y="34" text-anchor="middle" fill="#94a3b8" font-size="8">第1轮→A  第2轮→B  第3轮→A  第4轮→B ...</text>
    <text x="120" y="46" text-anchor="middle" fill="#ef4444" font-size="7" font-style="italic">上下文被 A/B 的失败记录填满，无法跳出</text>
  </g>

  <!-- Why: context constrains -->
  <g filter="url(#cardShadow)" transform="translate(60, 278)">
    <rect width="320" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="160" y="20" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">根因：解空间被历史记录约束</text>
    <text x="160" y="38" text-anchor="middle" fill="#94a3b8" font-size="8">上下文中没有"方案 C"的信息，注意力被 A/B 占据</text>
  </g>

  <!-- ===== RIGHT: Overconfidence ===== -->
  <text x="660" y="82" text-anchor="middle" fill="#8b5cf6" font-size="15" font-weight="700">过度自信</text>
  <text x="660" y="98" text-anchor="middle" fill="#64748b" font-size="10">"过早宣布成功，但结果是错的"</text>

  <!-- Execution steps -->
  <g filter="url(#cardShadow)" transform="translate(490, 115)">
    <rect width="340" height="100" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="170" y="22" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Agent 的"自我验证"</text>
    <line x1="12" y1="30" x2="328" y2="30" stroke="#334155" stroke-width="0.6"/>

    <!-- Step: simplify -->
    <text x="16" y="48" fill="#94a3b8" font-size="9">① 把三层 context 嵌套"简化"为一层</text>
    <text x="16" y="64" fill="#94a3b8" font-size="9">② 运行测试 → 全部通过 ✓</text>
    <text x="16" y="80" fill="#94a3b8" font-size="9">③ 检查代码 → "看起来没问题" ✓</text>

    <!-- Confidence badge -->
    <rect x="230" y="42" width="96" height="46" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.8"/>
    <text x="278" y="60" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">任务完成!</text>
    <text x="278" y="76" text-anchor="middle" fill="#6ee7b7" font-size="7">代码减少 30%</text>
  </g>

  <!-- Reality check -->
  <g filter="url(#cardShadow)" transform="translate(490, 228)">
    <rect width="340" height="56" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="170" y="20" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">实际情况</text>
    <text x="16" y="40" fill="#fca5a5" font-size="9">请求超时会关闭连接，连接超时会触发全局 shutdown</text>
    <text x="16" y="52" fill="#64748b" font-size="7" font-style="italic">测试没有覆盖这个边界情况 → 幻觉逃过了所有检查</text>
  </g>

  <!-- Why: confirmation bias -->
  <g filter="url(#cardShadow)" transform="translate(490, 298)">
    <rect width="340" height="30" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="170" y="20" text-anchor="middle" fill="#a78bfa" font-size="9">确认偏差：上下文充满自己的决策理由，倾向于认为自己是对的</text>
  </g>

  <!-- ===== Bottom: Shared Root Cause ===== -->
  <g transform="translate(40, 348)">
    <rect width="800" height="56" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1" opacity="0.7"/>
    <text x="400" y="22" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">共同根因：决策基于概率预测，不是逻辑推理</text>
    <text x="400" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Agent 没有"我不确定"这个概念 — 它只有"概率最高的下一步"。该重试就重试，该报告完成就报告完成</text>
  </g>
</svg>