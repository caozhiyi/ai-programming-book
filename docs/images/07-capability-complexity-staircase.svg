<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">能力在增长，复杂度和风险也在增长</text>
  <text x="440" y="54" text-anchor="middle" fill="#64748b" font-size="11">每一步都是权衡：用复杂度换能力。不是每个场景都需要走到最复杂的那一步</text>

  <!-- Y-axis labels -->
  <text x="30" y="130" fill="#10b981" font-size="9" font-weight="600" transform="rotate(-90, 30, 130)">能力</text>
  <text x="30" y="310" fill="#ef4444" font-size="9" font-weight="600" transform="rotate(-90, 30, 310)">风险</text>

  <!-- ===== Staircase Steps ===== -->

  <!-- Step 1: Pure Conversation -->
  <g filter="url(#cardShadow)" transform="translate(60, 260)">
    <rect width="148" height="100" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect width="148" height="3" rx="1.5" fill="#10b981" y="0"/>
    <text x="74" y="22" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">纯对话</text>
    <text x="74" y="38" text-anchor="middle" fill="#64748b" font-size="8">Ch.1-2</text>
    <line x1="10" y1="46" x2="138" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="74" y="62" text-anchor="middle" fill="#94a3b8" font-size="8">只能"说"，不能"做"</text>
    <!-- Capability bar -->
    <rect x="10" y="72" width="30" height="8" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="46" y="80" fill="#6ee7b7" font-size="7">能力 ●○○○○</text>
    <!-- Risk bar -->
    <rect x="10" y="84" width="15" height="8" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="46" y="92" fill="#fca5a5" font-size="7">风险 ●○○○○</text>
  </g>

  <!-- Step 2: Single Agent + Tools -->
  <g filter="url(#cardShadow)" transform="translate(220, 210)">
    <rect width="148" height="120" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <rect width="148" height="3" rx="1.5" fill="#3b82f6" y="0"/>
    <text x="74" y="22" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700">Agent + 工具</text>
    <text x="74" y="38" text-anchor="middle" fill="#64748b" font-size="8">Ch.3-4</text>
    <line x1="10" y1="46" x2="138" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="74" y="62" text-anchor="middle" fill="#94a3b8" font-size="8">能执行多步任务</text>
    <text x="74" y="76" text-anchor="middle" fill="#94a3b8" font-size="8">能调用外部工具</text>
    <!-- Capability bar -->
    <rect x="10" y="88" width="60" height="8" rx="4" fill="#3b82f6" fill-opacity="0.3"/>
    <text x="76" y="96" fill="#93c5fd" font-size="7">能力 ●●●○○</text>
    <!-- Risk bar -->
    <rect x="10" y="100" width="45" height="8" rx="4" fill="#ef4444" fill-opacity="0.25"/>
    <text x="76" y="108" fill="#fca5a5" font-size="7">风险 ●●○○○</text>
  </g>

  <!-- Step 3: Agent + Skill -->
  <g filter="url(#cardShadow)" transform="translate(380, 155)">
    <rect width="148" height="130" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect width="148" height="3" rx="1.5" fill="#8b5cf6" y="0"/>
    <text x="74" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">Agent + Skill</text>
    <text x="74" y="38" text-anchor="middle" fill="#64748b" font-size="8">Ch.5</text>
    <line x1="10" y1="46" x2="138" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="74" y="62" text-anchor="middle" fill="#94a3b8" font-size="8">预定义的能力包</text>
    <text x="74" y="76" text-anchor="middle" fill="#94a3b8" font-size="8">以正确的方式做事</text>
    <!-- Capability bar -->
    <rect x="10" y="90" width="90" height="8" rx="4" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="106" y="98" fill="#c4b5fd" font-size="7">●●●●○</text>
    <!-- Risk bar -->
    <rect x="10" y="102" width="60" height="8" rx="4" fill="#ef4444" fill-opacity="0.3"/>
    <text x="106" y="110" fill="#fca5a5" font-size="7">●●●○○</text>
    <!-- New risks -->
    <text x="74" y="126" text-anchor="middle" fill="#f59e0b" font-size="7">+ Skill 冲突、加载权衡</text>
  </g>

  <!-- Step 4: Multi-Agent -->
  <g filter="url(#cardShadow)" transform="translate(540, 90)">
    <rect width="148" height="140" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="148" height="3" rx="1.5" fill="#f59e0b" y="0"/>
    <text x="74" y="22" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">多 Agent</text>
    <text x="74" y="38" text-anchor="middle" fill="#64748b" font-size="8">Ch.6</text>
    <line x1="10" y1="46" x2="138" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="74" y="62" text-anchor="middle" fill="#94a3b8" font-size="8">分工协作</text>
    <text x="74" y="76" text-anchor="middle" fill="#94a3b8" font-size="8">处理大规模任务</text>
    <!-- Capability bar -->
    <rect x="10" y="90" width="120" height="8" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
    <text x="106" y="98" fill="#fbbf24" font-size="7">●●●●●</text>
    <!-- Risk bar -->
    <rect x="10" y="102" width="100" height="8" rx="4" fill="#ef4444" fill-opacity="0.35"/>
    <text x="106" y="110" fill="#fca5a5" font-size="7">●●●●○</text>
    <!-- New risks -->
    <text x="74" y="126" text-anchor="middle" fill="#f59e0b" font-size="7">+ 通信损失、分解质量</text>
    <text x="74" y="138" text-anchor="middle" fill="#f59e0b" font-size="7">+ 并行冲突、调试复杂度</text>
  </g>

  <!-- Step 5: With Fault Tolerance -->
  <g filter="url(#cardShadow)" transform="translate(700, 75)">
    <rect width="160" height="140" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
    <rect width="160" height="3" rx="1.5" fill="#10b981" y="0"/>
    <text x="80" y="22" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">+ 容错设计</text>
    <text x="80" y="38" text-anchor="middle" fill="#64748b" font-size="8">Ch.7</text>
    <line x1="10" y1="46" x2="150" y2="46" stroke="#334155" stroke-width="0.5"/>
    <text x="80" y="62" text-anchor="middle" fill="#94a3b8" font-size="8">超时 · 重试上限</text>
    <text x="80" y="76" text-anchor="middle" fill="#94a3b8" font-size="8">人工确认 · 回滚</text>
    <text x="80" y="90" text-anchor="middle" fill="#94a3b8" font-size="8">可观测性</text>
    <!-- Capability bar -->
    <rect x="10" y="102" width="120" height="8" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="106" y="110" fill="#6ee7b7" font-size="7">●●●●●</text>
    <!-- Risk bar (reduced!) -->
    <rect x="10" y="114" width="40" height="8" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="106" y="122" fill="#6ee7b7" font-size="7">●●○○○ ↓</text>
    <text x="80" y="138" text-anchor="middle" fill="#10b981" font-size="7" font-weight="600">风险可控</text>
  </g>

  <!-- ===== Staircase connecting lines ===== -->
  <line x1="208" y1="310" x2="220" y2="310" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="310" x2="220" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="368" y1="260" x2="380" y2="260" stroke="#334155" stroke-width="1.5"/>
  <line x1="380" y1="260" x2="380" y2="285" stroke="#334155" stroke-width="1.5"/>
  <line x1="528" y1="210" x2="540" y2="210" stroke="#334155" stroke-width="1.5"/>
  <line x1="540" y1="210" x2="540" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="688" y1="155" x2="700" y2="155" stroke="#334155" stroke-width="1.5"/>
  <line x1="700" y1="155" x2="700" y2="215" stroke="#334155" stroke-width="1.5"/>

  <!-- ===== Bottom insight ===== -->
  <g transform="translate(60, 378)">
    <rect width="760" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8" opacity="0.6"/>
    <text x="380" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">选择合适的复杂度，是使用 AI 编程工具最重要的判断之一</text>
  </g>
</svg>