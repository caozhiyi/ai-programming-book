<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="histGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">分层压缩策略：不同信息，不同对待</text>
  <text x="400" y="52" text-anchor="middle" fill="#64748b" font-size="11">对不同类型的上下文信息采用不同的压缩策略，而不是一刀切</text>

  <!-- Column headers -->
  <g transform="translate(30, 72)">
    <text x="120" y="14" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">信息类型</text>
    <text x="370" y="14" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">压缩策略</text>
    <text x="620" y="14" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">原因</text>
    <line x1="0" y1="22" x2="740" y2="22" stroke="#334155" stroke-width="0.8"/>
  </g>

  <!-- Row 1: System Prompt -->
  <g filter="url(#cardShadow)" transform="translate(30, 100)">
    <rect width="740" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="60" rx="2" fill="url(#sysGrad)"/>
    <!-- Type -->
    <text x="16" y="24" fill="#fca5a5" font-size="12" font-weight="700">System Prompt</text>
    <text x="16" y="44" fill="#64748b" font-size="10">行为约束 · 角色定义 · 核心规则</text>
    <!-- Strategy -->
    <rect x="260" y="14" width="100" height="28" rx="6" fill="#ef4444" fill-opacity="0.12"/>
    <text x="310" y="33" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">🔒 不压缩</text>
    <text x="370" y="20" fill="#fca5a5" font-size="8">压缩比 1:1</text>
    <!-- Reason -->
    <text x="420" y="30" fill="#94a3b8" font-size="10">每个字都影响模型行为</text>
    <text x="420" y="46" fill="#64748b" font-size="9">压缩可能改变约束的语义</text>
  </g>

  <!-- Row 2: Tool Descriptions -->
  <g filter="url(#cardShadow)" transform="translate(30, 170)">
    <rect width="740" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="60" rx="2" fill="url(#toolGrad)"/>
    <text x="16" y="24" fill="#fbbf24" font-size="12" font-weight="700">工具描述</text>
    <text x="16" y="44" fill="#64748b" font-size="10">Schema 定义 · 参数约束 · 用法说明</text>
    <rect x="260" y="14" width="100" height="28" rx="6" fill="#f59e0b" fill-opacity="0.12"/>
    <text x="310" y="33" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">✂️ 选择性注入</text>
    <text x="370" y="20" fill="#fbbf24" font-size="8">压缩比 ~3:1</text>
    <text x="420" y="30" fill="#94a3b8" font-size="10">只注入当前任务可能用到的工具</text>
    <text x="420" y="46" fill="#64748b" font-size="9">30个工具只注入10个 → 节省 ~67% Token</text>
  </g>

  <!-- Row 3: Dialog History -->
  <g filter="url(#cardShadow)" transform="translate(30, 240)">
    <rect width="740" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="60" rx="2" fill="url(#histGrad)"/>
    <text x="16" y="24" fill="#a78bfa" font-size="12" font-weight="700">对话历史</text>
    <text x="16" y="44" fill="#64748b" font-size="10">多轮对话 · 讨论过程 · 决策记录</text>
    <rect x="260" y="14" width="100" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.12"/>
    <text x="310" y="33" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">📝 摘要压缩</text>
    <text x="370" y="20" fill="#a78bfa" font-size="8">压缩比 ~5:1</text>
    <text x="420" y="30" fill="#94a3b8" font-size="10">保留决策和结论，丢弃讨论细节</text>
    <text x="420" y="46" fill="#64748b" font-size="9">渐进式：近期原文 → 中期摘要(3:1) → 远期摘要(10:1)</text>
  </g>

  <!-- Row 4: Tool Results -->
  <g filter="url(#cardShadow)" transform="translate(30, 310)">
    <rect width="740" height="60" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="60" rx="2" fill="url(#resultGrad)"/>
    <text x="16" y="24" fill="#67e8f9" font-size="12" font-weight="700">工具调用结果</text>
    <text x="16" y="44" fill="#64748b" font-size="10">文件内容 · 搜索结果 · 命令输出</text>
    <rect x="260" y="14" width="100" height="28" rx="6" fill="#06b6d4" fill-opacity="0.12"/>
    <text x="310" y="33" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">🗜️ 激进压缩</text>
    <text x="370" y="20" fill="#67e8f9" font-size="8">压缩比 ~20:1</text>
    <text x="420" y="30" fill="#94a3b8" font-size="10">只保留与当前任务相关的部分</text>
    <text x="420" y="46" fill="#64748b" font-size="9">5000行文件 → 只保留相关50行 → 节省 ~99% Token</text>
  </g>

  <!-- Row 5: Memory Injection -->
  <g filter="url(#cardShadow)" transform="translate(30, 380)">
    <rect width="740" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
    <rect width="4" height="60" rx="2" fill="url(#memGrad)"/>
    <text x="16" y="24" fill="#6ee7b7" font-size="12" font-weight="700">记忆注入</text>
    <text x="16" y="44" fill="#64748b" font-size="10">用户偏好 · 项目知识 · 历史决策</text>
    <rect x="260" y="14" width="100" height="28" rx="6" fill="#10b981" fill-opacity="0.12"/>
    <text x="310" y="33" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">📊 控制数量</text>
    <text x="370" y="20" fill="#6ee7b7" font-size="8">压缩比 ~8:1</text>
    <text x="420" y="30" fill="#94a3b8" font-size="10">写入时已压缩，检索时控制注入条数</text>
    <text x="420" y="46" fill="#64748b" font-size="9">Top-5 相关记忆 × ~200 Token/条 = ~1000 Token</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(30, 452)">
    <text x="370" y="14" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">核心思想：压缩力度与信息的精确性要求成反比 — 越需要精确的信息，越不能压缩</text>
  </g>
</svg>