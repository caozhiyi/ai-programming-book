<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="attnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="520" stroke="#fff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="520" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">大模型的处理流水线</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">从代码文本到概率预测 — 一切都是 Token</text>

  <!-- ==================== INPUT: Source Code ==================== -->
  <g filter="url(#cardShadow)" transform="translate(30, 95)">
    <rect width="160" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="80" y="24" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">输入</text>
    <rect x="12" y="34" width="136" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="80" y="54" text-anchor="middle" fill="#06b6d4" font-size="12" font-family="monospace">response.status</text>
    <text x="80" y="70" text-anchor="middle" fill="#06b6d4" font-size="12" font-family="monospace">_code</text>
  </g>

  <!-- Arrow: Input → Tokenizer -->
  <line x1="192" y1="140" x2="228" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <!-- ==================== STAGE 1: Tokenizer ==================== -->
  <g filter="url(#cardShadow)" transform="translate(230, 90)">
    <rect width="180" height="100" rx="14" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <rect width="180" height="4" rx="2" fill="url(#tokenGrad)" y="0"/>
    <circle cx="28" cy="30" r="14" fill="url(#tokenGrad)" opacity="0.9"/>
    <text x="28" y="35" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
    <text x="52" y="34" fill="#e2e8f0" font-size="15" font-weight="700">Token 化</text>
    <text x="16" y="52" fill="#94a3b8" font-size="10">BPE 统计切分</text>
    <!-- Token chips -->
    <g transform="translate(12, 62)">
      <rect width="56" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="28" y="15" text-anchor="middle" fill="#06b6d4" font-size="9" font-family="monospace">response</text>
    </g>
    <g transform="translate(72, 62)">
      <rect width="16" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="8" y="15" text-anchor="middle" fill="#06b6d4" font-size="9" font-family="monospace">.</text>
    </g>
    <g transform="translate(92, 62)">
      <rect width="40" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="20" y="15" text-anchor="middle" fill="#06b6d4" font-size="9" font-family="monospace">status</text>
    </g>
    <g transform="translate(136, 62)">
      <rect width="36" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="18" y="15" text-anchor="middle" fill="#06b6d4" font-size="9" font-family="monospace">_code</text>
    </g>
  </g>

  <!-- Arrow: Tokenizer → Attention -->
  <line x1="412" y1="140" x2="448" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <!-- ==================== STAGE 2: Attention ==================== -->
  <g filter="url(#cardShadow)" transform="translate(450, 90)">
    <rect width="200" height="100" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="200" height="4" rx="2" fill="url(#attnGrad)" y="0"/>
    <circle cx="28" cy="30" r="14" fill="url(#attnGrad)" opacity="0.9"/>
    <text x="28" y="35" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>
    <text x="52" y="34" fill="#e2e8f0" font-size="15" font-weight="700">注意力计算</text>
    <text x="16" y="52" fill="#94a3b8" font-size="10">Multi-Head Attention</text>
    <!-- Attention visualization: connection lines -->
    <g transform="translate(16, 62)">
      <!-- Token nodes -->
      <circle cx="10" cy="12" r="8" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="55" cy="12" r="8" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="100" cy="12" r="8" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="145" cy="12" r="8" fill="#8b5cf6" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5"/>
      <!-- Attention lines (varying opacity = varying weight) -->
      <line x1="145" y1="12" x2="10" y2="12" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
      <line x1="145" y1="12" x2="55" y2="12" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
      <line x1="145" y1="12" x2="100" y2="12" stroke="#8b5cf6" stroke-width="2.5" opacity="0.9"/>
      <!-- Labels -->
      <text x="10" y="30" text-anchor="middle" fill="#64748b" font-size="7">resp</text>
      <text x="55" y="30" text-anchor="middle" fill="#64748b" font-size="7">.</text>
      <text x="100" y="30" text-anchor="middle" fill="#64748b" font-size="7">status</text>
      <text x="145" y="30" text-anchor="middle" fill="#a78bfa" font-size="7" font-weight="600">_code</text>
    </g>
  </g>

  <!-- Arrow: Attention → Generation -->
  <line x1="652" y1="140" x2="688" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrowWhite)"/>

  <!-- ==================== STAGE 3: Autoregressive Generation ==================== -->
  <g filter="url(#cardShadow)" transform="translate(690, 90)">
    <rect width="180" height="100" rx="14" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect width="180" height="4" rx="2" fill="url(#genGrad)" y="0"/>
    <circle cx="28" cy="30" r="14" fill="url(#genGrad)" opacity="0.9"/>
    <text x="28" y="35" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3</text>
    <text x="52" y="34" fill="#e2e8f0" font-size="15" font-weight="700">概率预测</text>
    <text x="16" y="52" fill="#94a3b8" font-size="10">自回归生成 (Autoregressive)</text>
    <!-- Probability bars -->
    <g transform="translate(16, 62)">
      <rect width="90" height="8" rx="3" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="96" y="8" fill="#f59e0b" font-size="8">return 35%</text>
      <rect y="12" width="52" height="8" rx="3" fill="#f59e0b" fill-opacity="0.5"/>
      <text x="58" y="20" fill="#d97706" font-size="8">if 20%</text>
      <rect y="24" width="38" height="8" rx="3" fill="#f59e0b" fill-opacity="0.3"/>
      <text x="44" y="32" fill="#92400e" font-size="8">result 15%</text>
    </g>
  </g>

  <!-- ==================== DETAIL SECTION: Three Key Insights ==================== -->

  <!-- Insight 1: Token化 -->
  <g filter="url(#cardShadow)" transform="translate(30, 230)">
    <rect width="270" height="130" rx="12" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <rect width="270" height="3" rx="1.5" fill="#06b6d4" y="0"/>
    <!-- Icon -->
    <g transform="translate(16, 18)">
      <rect width="20" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
      <text x="10" y="14" text-anchor="middle" fill="#06b6d4" font-size="11">✂</text>
    </g>
    <text x="44" y="33" fill="#e2e8f0" font-size="13" font-weight="600">Token 化的影响</text>
    <line x1="16" y1="44" x2="254" y2="44" stroke="#1e3a4a" stroke-width="1"/>
    <text x="16" y="62" fill="#94a3b8" font-size="10">• 同一段代码在不同模型中被切分方式不同</text>
    <text x="16" y="78" fill="#94a3b8" font-size="10">• Token 数量直接决定 API 成本</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">• 代码专用 Tokenizer 效率更高</text>
    <text x="16" y="114" fill="#64748b" font-size="9" font-style="italic">一切都是 Token — 理解大模型的第一块基石</text>
  </g>

  <!-- Insight 2: 注意力 -->
  <g filter="url(#cardShadow)" transform="translate(315, 230)">
    <rect width="270" height="130" rx="12" fill="#1a1533" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
    <rect width="270" height="3" rx="1.5" fill="#8b5cf6" y="0"/>
    <g transform="translate(16, 18)">
      <rect width="20" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="10" y="14" text-anchor="middle" fill="#8b5cf6" font-size="11">🔗</text>
    </g>
    <text x="44" y="33" fill="#e2e8f0" font-size="13" font-weight="600">注意力的特性</text>
    <line x1="16" y1="44" x2="254" y2="44" stroke="#2a1a4a" stroke-width="1"/>
    <text x="16" y="62" fill="#94a3b8" font-size="10">• 每个 Token 同时看到所有其他 Token</text>
    <text x="16" y="78" fill="#94a3b8" font-size="10">• 多头注意力捕捉不同维度的关联</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">• 计算成本 O(n²)，窗口越大越贵</text>
    <text x="16" y="114" fill="#64748b" font-size="9" font-style="italic">不是逐字阅读，而是建立全局关联网络</text>
  </g>

  <!-- Insight 3: 自回归 -->
  <g filter="url(#cardShadow)" transform="translate(600, 230)">
    <rect width="270" height="130" rx="12" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
    <rect width="270" height="3" rx="1.5" fill="#f59e0b" y="0"/>
    <g transform="translate(16, 18)">
      <rect width="20" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="14" text-anchor="middle" fill="#f59e0b" font-size="11">🎲</text>
    </g>
    <text x="44" y="33" fill="#e2e8f0" font-size="13" font-weight="600">自回归的后果</text>
    <line x1="16" y1="44" x2="254" y2="44" stroke="#3a2a0a" stroke-width="1"/>
    <text x="16" y="62" fill="#94a3b8" font-size="10">• 一个 Token 一个 Token 往外蹦</text>
    <text x="16" y="78" fill="#94a3b8" font-size="10">• 偏差会累积，越长越容易跑偏</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">• 不能回头修改，没有"草稿纸"</text>
    <text x="16" y="114" fill="#64748b" font-size="9" font-style="italic">不是"想好了再说"，而是边说边想</text>
  </g>

  <!-- ==================== BOTTOM: Capability Shape ==================== -->
  <g filter="url(#cardShadow)" transform="translate(30, 390)">
    <rect width="840" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
    <text x="420" y="24" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">能力的形状：概率预测机制的结构性局限</text>
    <line x1="30" y1="36" x2="810" y2="36" stroke="#334155" stroke-width="1"/>
    <!-- Four limitations -->
    <g transform="translate(30, 48)">
      <rect width="170" height="40" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.8"/>
      <text x="85" y="18" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">🧮 数学计算</text>
      <text x="85" y="32" text-anchor="middle" fill="#64748b" font-size="9">模式匹配，非真正运算</text>
    </g>
    <g transform="translate(220, 48)">
      <rect width="170" height="40" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.8"/>
      <text x="85" y="18" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">📏 精确计数</text>
      <text x="85" y="32" text-anchor="middle" fill="#64748b" font-size="9">Token ≠ 字符/行/元素</text>
    </g>
    <g transform="translate(410, 48)">
      <rect width="170" height="40" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.8"/>
      <text x="85" y="18" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">🔗 长距离推理</text>
      <text x="85" y="32" text-anchor="middle" fill="#64748b" font-size="9">每步偏差累积放大</text>
    </g>
    <g transform="translate(600, 48)">
      <rect width="170" height="40" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.8"/>
      <text x="85" y="18" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">👻 幻觉</text>
      <text x="85" y="32" text-anchor="middle" fill="#64748b" font-size="9">概率预测的必然副产品</text>
    </g>
  </g>
</svg>