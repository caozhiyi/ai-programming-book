<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="780" height="280" rx="12" fill="url(#bgGrad)"/>

  <!-- Source code label -->
  <text x="390" y="28" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">同一段代码 response.status_code 在不同 Tokenizer 下的切分方式</text>

  <!-- Model A -->
  <g filter="url(#cardShadow)" transform="translate(30, 48)">
    <rect width="720" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600">模型 A（代码专用 Tokenizer）</text>
    <g transform="translate(16, 32)">
      <rect width="100" height="22" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="50" y="15" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="monospace">response</text>
      <rect x="108" width="16" height="22" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="116" y="15" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="monospace">.</text>
      <rect x="132" width="72" height="22" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="168" y="15" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="monospace">status</text>
      <rect x="212" width="64" height="22" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="244" y="15" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="monospace">_code</text>
    </g>
    <text x="380" y="46" fill="#475569" font-size="10">→ 4 个 Token</text>
    <rect x="500" y="30" width="80" height="22" rx="5" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.6"/>
    <text x="540" y="45" text-anchor="middle" fill="#10b981" font-size="9">效率高 ✓</text>
  </g>

  <!-- Model B -->
  <g filter="url(#cardShadow)" transform="translate(30, 118)">
    <rect width="720" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600">模型 B（通用 Tokenizer）</text>
    <g transform="translate(16, 32)">
      <rect width="60" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="30" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">resp</text>
      <rect x="68" width="56" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="96" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">onse</text>
      <rect x="132" width="16" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="140" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">.</text>
      <rect x="156" width="48" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="180" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">stat</text>
      <rect x="212" width="40" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="232" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">us</text>
      <rect x="260" width="16" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="268" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">_</text>
      <rect x="284" width="56" height="22" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="312" y="15" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="monospace">code</text>
    </g>
    <text x="380" y="46" fill="#475569" font-size="10">→ 7 个 Token</text>
    <rect x="500" y="30" width="80" height="22" rx="5" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.6"/>
    <text x="540" y="45" text-anchor="middle" fill="#ef4444" font-size="9">效率低 ✗</text>
  </g>

  <!-- Model C -->
  <g filter="url(#cardShadow)" transform="translate(30, 188)">
    <rect width="720" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600">模型 C（大量代码训练的 Tokenizer）</text>
    <g transform="translate(16, 32)">
      <rect width="100" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="50" y="15" text-anchor="middle" fill="#8b5cf6" font-size="10" font-family="monospace">response</text>
      <rect x="108" width="16" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="116" y="15" text-anchor="middle" fill="#8b5cf6" font-size="10" font-family="monospace">.</text>
      <rect x="132" width="120" height="22" rx="5" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="192" y="15" text-anchor="middle" fill="#8b5cf6" font-size="10" font-family="monospace">status_code</text>
    </g>
    <text x="380" y="46" fill="#475569" font-size="10">→ 3 个 Token</text>
    <rect x="500" y="30" width="80" height="22" rx="5" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.6"/>
    <text x="540" y="45" text-anchor="middle" fill="#10b981" font-size="9">效率最高 ✓✓</text>
  </g>

  <!-- Bottom note -->
  <text x="390" y="268" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">Token 数量不同 → API 成本不同 → 上下文窗口能装的有效信息量不同</text>
</svg>