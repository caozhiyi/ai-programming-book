<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="680" height="260" rx="12" fill="url(#bgGrad)"/>

  <text x="340" y="26" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">Lost in the Middle：注意力在上下文中的分布</text>

  <!-- Attention curve area -->
  <g transform="translate(50, 45)">
    <!-- Axes -->
    <line x1="0" y1="130" x2="580" y2="130" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="#334155" stroke-width="1"/>

    <!-- Y-axis label -->
    <text x="-10" y="70" fill="#64748b" font-size="9" text-anchor="end" transform="rotate(-90, -10, 70)">注意力强度</text>

    <!-- U-shaped curve with fill -->
    <path d="M 0 20 C 30 25, 80 90, 140 105 C 200 115, 250 118, 290 118 C 330 118, 380 115, 440 105 C 500 90, 550 25, 580 20" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M 0 20 C 30 25, 80 90, 140 105 C 200 115, 250 118, 290 118 C 330 118, 380 115, 440 105 C 500 90, 550 25, 580 20 L 580 130 L 0 130 Z" fill="#f59e0b" opacity="0.06"/>

    <!-- Danger zone highlight -->
    <rect x="140" y="0" width="300" height="130" fill="#ef4444" opacity="0.04" rx="4"/>

    <!-- Zone labels -->
    <g transform="translate(0, 140)">
      <!-- Start zone -->
      <rect x="0" width="130" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="0.6"/>
      <text x="65" y="15" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">开头 — System Prompt</text>

      <!-- Middle zone -->
      <rect x="150" width="280" height="22" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="0.6"/>
      <text x="290" y="15" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">中间 — 注意力洼地 ⚠</text>

      <!-- End zone -->
      <rect x="450" width="130" height="22" rx="4" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="0.6"/>
      <text x="515" y="15" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">结尾 — 最新消息</text>
    </g>

    <!-- Annotation arrows with data -->
    <text x="50" y="12" text-anchor="middle" fill="#a78bfa" font-size="8">准确率 ~75%</text>
    <text x="290" y="112" text-anchor="middle" fill="#ef4444" font-size="8" opacity="0.8">准确率 ~56% (↓25%)</text>
    <text x="530" y="12" text-anchor="middle" fill="#93c5fd" font-size="8">准确率 ~72%</text>

    <!-- Data points from Liu et al. 2023 -->
    <circle cx="30" cy="25" r="3" fill="#a78bfa" opacity="0.8"/>
    <circle cx="100" cy="75" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="190" cy="100" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="290" cy="115" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="390" cy="100" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="480" cy="75" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="550" cy="25" r="3" fill="#93c5fd" opacity="0.8"/>

    <!-- Paper reference -->
    <text x="290" y="-6" text-anchor="middle" fill="#475569" font-size="7" font-style="italic">数据来源：Liu et al. "Lost in the Middle" (2023) — 20 文档 NQ 任务</text>
  </g>

  <!-- Practical implication -->
  <g transform="translate(50, 220)">
    <text x="290" y="12" text-anchor="middle" fill="#94a3b8" font-size="10">实践指导：重要信息放开头或结尾 | 长文档分块处理而非整体塞入 | 信息排列顺序本身就是提示词工程</text>
    <text x="290" y="30" text-anchor="middle" fill="#475569" font-size="9" font-style="italic">上下文的质量远比数量重要 — 128K 窗口塞满无关信息，效果可能不如精心组织的 4K</text>
  </g>
</svg>