<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="workingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="shortGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="longGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" rx="16" fill="url(#bgGrad)"/>
  <g opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="580" stroke="#fff"/>
    <line x1="180" y1="0" x2="180" y2="580" stroke="#fff"/>
    <line x1="300" y1="0" x2="300" y2="580" stroke="#fff"/>
    <line x1="420" y1="0" x2="420" y2="580" stroke="#fff"/>
    <line x1="540" y1="0" x2="540" y2="580" stroke="#fff"/>
    <line x1="660" y1="0" x2="660" y2="580" stroke="#fff"/>
    <line x1="780" y1="0" x2="780" y2="580" stroke="#fff"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">记忆体系的三层模型</text>
  <text x="450" y="66" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="0.5">在无状态的引擎上，构建有状态的体验</text>

  <!-- ==================== THREE LAYERS ==================== -->

  <!-- Layer 1: Working Memory -->
  <g filter="url(#cardShadow)" transform="translate(40, 90)">
    <rect width="260" height="280" rx="14" fill="#0f2a3a" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#workingGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#workingGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">工作记忆</text>
    <text x="56" y="46" fill="#06b6d4" font-size="10">Working Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#1e3a4a" stroke-width="0.8"/>

    <!-- Scope -->
    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#06b6d4" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="600">当前上下文窗口中的内容</text>
    </g>

    <!-- Description -->
    <text x="16" y="110" fill="#94a3b8" font-size="10">模型"此刻能看到"的全部信息</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">直接参与推理，无需额外检索</text>

    <!-- Characteristics -->
    <line x1="16" y1="140" x2="244" y2="140" stroke="#1e3a4a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ 生命周期：单次推理调用</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 存储位置：上下文窗口</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 容量：有限 (128K~200K Token)</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ 访问速度：最快（直接可见）</text>

    <!-- Visual: context window -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#06b6d4" fill-opacity="0.05" stroke="#06b6d4" stroke-width="0.5"/>
      <text x="8" y="14" fill="#67e8f9" font-size="8" font-weight="600">上下文窗口内容</text>
      <text x="8" y="28" fill="#64748b" font-size="8">📋 System Prompt + 工具描述</text>
      <text x="8" y="42" fill="#64748b" font-size="8">💬 对话历史 + 注入的记忆</text>
    </g>
  </g>

  <!-- Layer 2: Short-term Memory -->
  <g filter="url(#cardShadow)" transform="translate(320, 90)">
    <rect width="260" height="280" rx="14" fill="#1a1533" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#shortGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#shortGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">短期记忆</text>
    <text x="56" y="46" fill="#8b5cf6" font-size="10">Short-term Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#2a1a4a" stroke-width="0.8"/>

    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">对话历史的压缩摘要</text>
    </g>

    <text x="16" y="110" fill="#94a3b8" font-size="10">保留关键决策和结论</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">丢弃讨论过程和细节</text>

    <line x1="16" y1="140" x2="244" y2="140" stroke="#2a1a4a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ 生命周期：当前会话</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 存储位置：客户端 / 服务端缓存</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 容量：中等（摘要后远小于原文）</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ 访问速度：需加载到工作记忆</text>

    <!-- Visual: summary -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#8b5cf6" fill-opacity="0.05" stroke="#8b5cf6" stroke-width="0.5"/>
      <text x="8" y="14" fill="#a78bfa" font-size="8" font-weight="600">摘要示例</text>
      <text x="8" y="28" fill="#64748b" font-size="8">📝 决定用 PostgreSQL，用户表 4 字段</text>
      <text x="8" y="42" fill="#64748b" font-size="8">📝 email 加唯一索引，id 用 UUID</text>
    </g>
  </g>

  <!-- Layer 3: Long-term Memory -->
  <g filter="url(#cardShadow)" transform="translate(600, 90)">
    <rect width="260" height="280" rx="14" fill="#1f1a0a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <rect width="260" height="4" rx="2" fill="url(#longGrad)" y="0"/>
    <circle cx="32" cy="32" r="16" fill="url(#longGrad)" opacity="0.9"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
    <text x="56" y="30" fill="#e2e8f0" font-size="16" font-weight="700">长期记忆</text>
    <text x="56" y="46" fill="#f59e0b" font-size="10">Long-term Memory</text>

    <line x1="16" y1="56" x2="244" y2="56" stroke="#3a2a0a" stroke-width="0.8"/>

    <g transform="translate(16, 66)">
      <rect width="228" height="24" rx="6" fill="#f59e0b" fill-opacity="0.08"/>
      <text x="114" y="16" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">跨会话持久化存储</text>
    </g>

    <text x="16" y="110" fill="#94a3b8" font-size="10">用户偏好、项目知识、架构决策</text>
    <text x="16" y="126" fill="#94a3b8" font-size="10">存储在外部系统，按需检索</text>

    <line x1="16" y1="140" x2="244" y2="140" stroke="#3a2a0a" stroke-width="0.5"/>
    <text x="16" y="158" fill="#64748b" font-size="9">⏱ 生命周期：永久（除非显式删除）</text>
    <text x="16" y="174" fill="#64748b" font-size="9">💾 存储位置：数据库 / 向量存储</text>
    <text x="16" y="190" fill="#64748b" font-size="9">📏 容量：最大（持续积累）</text>
    <text x="16" y="206" fill="#64748b" font-size="9">⚡ 访问速度：最慢（需检索+注入）</text>

    <!-- Visual: persistent store -->
    <g transform="translate(16, 218)">
      <rect width="228" height="50" rx="6" fill="#f59e0b" fill-opacity="0.05" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="8" y="14" fill="#fbbf24" font-size="8" font-weight="600">持久化记忆</text>
      <text x="8" y="28" fill="#64748b" font-size="8">🎯 偏好：slog 日志 | Tab 缩进</text>
      <text x="8" y="42" fill="#64748b" font-size="8">🏗 决策：Cache-Aside | gRPC 通信</text>
    </g>
  </g>

  <!-- ==================== DATA FLOW ==================== -->

  <!-- Flow arrows between layers -->
  <!-- Long-term → Working: "回忆" -->
  <path d="M 640 375 C 640 400, 400 400, 300 380" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowCyan)" opacity="0.7"/>
  <text x="460" y="408" text-anchor="middle" fill="#f59e0b" font-size="9" opacity="0.9">检索 → 注入（回忆）</text>

  <!-- Working → Short-term: "压缩" -->
  <path d="M 300 372 L 370 372" stroke="#06b6d4" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <text x="335" y="386" text-anchor="middle" fill="#94a3b8" font-size="9">压缩</text>

  <!-- Short-term → Long-term: "记住" -->
  <path d="M 580 372 L 640 372" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrowAmber)" opacity="0.7"/>
  <text x="610" y="386" text-anchor="middle" fill="#94a3b8" font-size="9">写入</text>

  <!-- ==================== BOTTOM: Cycle Description ==================== -->
  <g filter="url(#cardShadow)" transform="translate(40, 430)">
    <rect width="820" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
    <rect width="820" height="3" rx="1.5" fill="url(#flowGrad)" y="0"/>
    <text x="410" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">数据流动循环</text>
    <text x="410" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">会话开始：长期记忆 → 检索相关信息 → 注入工作记忆（"回忆"）</text>
    <text x="410" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">会话结束：工作记忆 → 压缩为短期记忆 → 提取有价值部分 → 写入长期记忆（"记住"）</text>
  </g>

  <!-- ==================== BOTTOM: Analogy ==================== -->
  <g transform="translate(40, 520)">
    <rect width="820" height="44" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="410" y="18" text-anchor="middle" fill="#94a3b8" font-size="10">💡 类比计算机存储层次：工作记忆 ≈ CPU 寄存器 | 短期记忆 ≈ 内存 | 长期记忆 ≈ 磁盘</text>
    <text x="410" y="36" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">核心差异：信息的"相关性"是语义层面的，不是地址层面的</text>
  </g>
</svg>