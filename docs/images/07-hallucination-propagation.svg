<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">幻觉在执行链条中的传播与放大</text>
  <text x="440" y="54" text-anchor="middle" fill="#64748b" font-size="11">一个小幻觉如何在 Agent 的 ReAct 循环中逐步扩散，最终导致整个任务偏离正轨</text>

  <!-- ===== Step 1-2: Normal (Green) ===== -->
  <g filter="url(#cardShadow)" transform="translate(20, 80)">
    <rect width="120" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect width="120" height="3" rx="1.5" fill="#10b981" y="0"/>
    <text x="60" y="22" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">Step 1</text>
    <text x="60" y="40" text-anchor="middle" fill="#94a3b8" font-size="9">搜索代码库</text>
    <text x="60" y="56" text-anchor="middle" fill="#6ee7b7" font-size="8">✓ 工具返回真实结果</text>
    <rect x="10" y="66" width="100" height="16" rx="4" fill="#10b981" fill-opacity="0.08"/>
    <text x="60" y="78" text-anchor="middle" fill="#475569" font-size="7">正常</text>
  </g>

  <line x1="144" y1="125" x2="162" y2="125" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <g filter="url(#cardShadow)" transform="translate(166, 80)">
    <rect width="120" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect width="120" height="3" rx="1.5" fill="#10b981" y="0"/>
    <text x="60" y="22" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">Step 2</text>
    <text x="60" y="40" text-anchor="middle" fill="#94a3b8" font-size="9">分析搜索结果</text>
    <text x="60" y="56" text-anchor="middle" fill="#6ee7b7" font-size="8">✓ 正确理解结果</text>
    <rect x="10" y="66" width="100" height="16" rx="4" fill="#10b981" fill-opacity="0.08"/>
    <text x="60" y="78" text-anchor="middle" fill="#475569" font-size="7">正常</text>
  </g>

  <line x1="290" y1="125" x2="308" y2="125" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- ===== Step 3: Hallucination Origin (Red) ===== -->
  <g filter="url(#cardShadow)" transform="translate(312, 72)">
    <rect width="130" height="106" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect width="130" height="3" rx="1.5" fill="#ef4444" y="0"/>
    <text x="65" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Step 3 ⚠</text>
    <text x="65" y="40" text-anchor="middle" fill="#fca5a5" font-size="9">生成分析报告</text>
    <line x1="12" y1="48" x2="118" y2="48" stroke="#334155" stroke-width="0.6"/>
    <text x="65" y="62" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="600">幻觉产生</text>
    <text x="65" y="76" text-anchor="middle" fill="#94a3b8" font-size="7">"找到 validateUserToken</text>
    <text x="65" y="88" text-anchor="middle" fill="#94a3b8" font-size="7">位于 auth/token.go:42"</text>
    <text x="65" y="100" text-anchor="middle" fill="#ef4444" font-size="7" font-style="italic">实际不存在</text>
  </g>

  <!-- Explosion marker -->
  <circle cx="377" cy="68" r="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="377" y="72" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">!</text>

  <line x1="446" y1="125" x2="464" y2="125" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ===== Step 4-6: Propagation (Increasingly Red) ===== -->
  <g filter="url(#cardShadow)" transform="translate(468, 80)">
    <rect width="120" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" opacity="0.9"/>
    <rect width="120" height="3" rx="1.5" fill="#ef4444" y="0"/>
    <text x="60" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Step 4</text>
    <text x="60" y="40" text-anchor="middle" fill="#fca5a5" font-size="9">基于幻觉写代码</text>
    <text x="60" y="56" text-anchor="middle" fill="#94a3b8" font-size="7">调用不存在的函数</text>
    <rect x="10" y="66" width="100" height="16" rx="4" fill="#ef4444" fill-opacity="0.08"/>
    <text x="60" y="78" text-anchor="middle" fill="#ef4444" font-size="7">错误扩散</text>
  </g>

  <line x1="592" y1="125" x2="610" y2="125" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <g filter="url(#cardShadow)" transform="translate(614, 80)">
    <rect width="120" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" opacity="0.85"/>
    <rect width="120" height="3" rx="1.5" fill="#ef4444" y="0"/>
    <text x="60" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Step 5</text>
    <text x="60" y="40" text-anchor="middle" fill="#fca5a5" font-size="9">扩展更多功能</text>
    <text x="60" y="56" text-anchor="middle" fill="#94a3b8" font-size="7">基于错误代码继续</text>
    <rect x="10" y="66" width="100" height="16" rx="4" fill="#ef4444" fill-opacity="0.08"/>
    <text x="60" y="78" text-anchor="middle" fill="#ef4444" font-size="7">偏离加深</text>
  </g>

  <line x1="738" y1="125" x2="756" y2="125" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <g filter="url(#cardShadow)" transform="translate(760, 80)">
    <rect width="100" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" opacity="0.8"/>
    <rect width="100" height="3" rx="1.5" fill="#ef4444" y="0"/>
    <text x="50" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Step 6+</text>
    <text x="50" y="40" text-anchor="middle" fill="#fca5a5" font-size="9">错误修复</text>
    <text x="50" y="56" text-anchor="middle" fill="#94a3b8" font-size="7">方向完全错误</text>
    <rect x="8" y="66" width="84" height="16" rx="4" fill="#ef4444" fill-opacity="0.08"/>
    <text x="50" y="78" text-anchor="middle" fill="#ef4444" font-size="7">失控</text>
  </g>

  <!-- ===== Divergence visualization ===== -->
  <g transform="translate(20, 200)">
    <rect width="840" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="0.8" opacity="0.6"/>
    <text x="420" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">偏离程度随步骤指数级增长</text>

    <!-- Baseline (correct path) -->
    <line x1="40" y1="60" x2="800" y2="60" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="810" y="64" fill="#10b981" font-size="7">正确路径</text>

    <!-- Actual path (diverging) -->
    <polyline points="40,60 180,60 260,56 340,48 460,38 580,34 700,34 800,34" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="810" y="38" fill="#ef4444" font-size="7">实际路径</text>

    <!-- Divergence markers -->
    <line x1="260" y1="56" x2="260" y2="60" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="340" y1="48" x2="340" y2="60" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="460" y1="38" x2="460" y2="60" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="580" y1="34" x2="580" y2="60" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="260" y="72" text-anchor="middle" fill="#f59e0b" font-size="7">幻觉</text>
  </g>

  <!-- ===== Key insight: why hard to detect ===== -->
  <g transform="translate(20, 305)">
    <rect width="410" height="80" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" opacity="0.9" filter="url(#cardShadow)"/>
    <text x="205" y="22" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">为什么难以发现？</text>
    <text x="16" y="42" fill="#94a3b8" font-size="9">• 用户只看最终结果，不逐步检查中间过程</text>
    <text x="16" y="58" fill="#94a3b8" font-size="9">• 模型不区分"工具返回的事实"和"自己编造的信息"</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9">• 如果最终测试通过，幻觉可能完全逃过审查</text>
  </g>

  <g transform="translate(450, 305)">
    <rect width="410" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1" opacity="0.9" filter="url(#cardShadow)"/>
    <text x="205" y="22" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">结构性根因</text>
    <text x="16" y="42" fill="#94a3b8" font-size="9">• 上下文中的所有信息对模型来说都是"已知事实"</text>
    <text x="16" y="58" fill="#94a3b8" font-size="9">• 模型没有"这可能是我自己编造的"这个概念</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9">• 只要执行机制是基于历史上下文，传播就不可避免</text>
  </g>
</svg>