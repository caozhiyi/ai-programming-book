<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#bgGrad)"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Agent 网络：多 Agent 协作架构</text>

  <!-- Orchestrator Agent (center top) -->
  <g transform="translate(300, 55)">
    <rect width="200" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">🧠 编排 Agent</text>
    <text x="100" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">任务分解 · 结果整合 · 冲突协调</text>
  </g>

  <!-- User -->
  <g transform="translate(60, 65)">
    <rect width="100" height="36" rx="8" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="23" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">👤 用户</text>
  </g>
  <line x1="160" y1="83" x2="300" y2="83" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Specialist Agents -->
  <!-- Frontend Agent -->
  <g transform="translate(50, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">🎨 前端 Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">React/Vue 组件</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">UI 逻辑 · 样式</text>
  </g>

  <!-- Backend Agent -->
  <g transform="translate(315, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">⚙️ 后端 Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">API 设计 · 业务逻辑</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">数据库操作</text>
  </g>

  <!-- Test Agent -->
  <g transform="translate(580, 180)">
    <rect width="170" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="85" y="22" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">🧪 测试 Agent</text>
    <text x="85" y="40" text-anchor="middle" fill="#64748b" font-size="8">单元测试 · 集成测试</text>
    <text x="85" y="54" text-anchor="middle" fill="#64748b" font-size="8">回归验证</text>
  </g>

  <!-- Connection lines from Orchestrator to Specialists -->
  <line x1="350" y1="110" x2="135" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="400" y1="110" x2="400" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="450" y1="110" x2="665" y2="180" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Shared Protocol Layer -->
  <g transform="translate(100, 290)">
    <rect width="600" height="40" rx="8" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="300" y="16" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">📡 Agent 间通信协议（A2A）</text>
    <text x="300" y="32" text-anchor="middle" fill="#64748b" font-size="8">能力声明 · 任务委托 · 状态同步 · 结果返回</text>
  </g>

  <!-- Connection from agents to protocol -->
  <line x1="135" y1="250" x2="135" y2="290" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="400" y1="250" x2="400" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="665" y1="250" x2="665" y2="290" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Challenges at bottom -->
  <g transform="translate(60, 360)">
    <rect width="200" height="60" rx="8" fill="#7f1d1d" opacity="0.3" stroke="#f87171" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">🔒 挑战一：信任传递</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">Agent B 的输出可靠吗？</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">错误沿调用链传播</text>
  </g>

  <g transform="translate(300, 360)">
    <rect width="200" height="60" rx="8" fill="#78350f" opacity="0.3" stroke="#fbbf24" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">🔄 挑战二：状态协调</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">多 Agent 并发修改</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">非确定性的并发控制</text>
  </g>

  <g transform="translate(540, 360)">
    <rect width="200" height="60" rx="8" fill="#1e3a5f" opacity="0.3" stroke="#60a5fa" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">📋 挑战三：标准化</text>
    <text x="100" y="36" text-anchor="middle" fill="#64748b" font-size="8">通信协议 · 能力描述</text>
    <text x="100" y="50" text-anchor="middle" fill="#64748b" font-size="8">从 MCP 到 A2A 的跨越</text>
  </g>
</svg>
