<g transform="translate(30, 1140)"><rect width="860" height="86" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" opacity="0.8"/><text x="430" y="20" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">关键认知</text><text x="430" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">LLM 只负责“决策”（生成 Function Call JSON），不执行任何操作；Client 负责路由，Server 负责执行。</text><text x="430" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">list_changed 只通知“列表变了”，不带内容，要拿到新列表必须重新调用 tools/list；ttlMs 与通知互补。</text><text x="430" y="76" text-anchor="middle" fill="#64748b" font-size="10">是否订阅并处理通知取决于 Client；工具描述一变，上下文前缀随之改变，缓存会失效（见第 9 章）。</text></g>
