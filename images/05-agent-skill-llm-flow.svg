<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 855" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmberBack" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurpleBack" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreenBack" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#10b981"/>
    </marker>
    <marker id="arrowBlueBack" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowCyanBack" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="855" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700" letter-spacing="1">Agent ↔ Skill ↔ LLM 交互时序图（渐进式披露）</text>
  <text x="480" y="54" text-anchor="middle" fill="#64748b" font-size="11">Agent 提供 Skill 简介列表 → LLM 按需请求完整内容 → 逐步展开，而非一次性全量加载</text>

  <!-- ===== Participant Headers ===== -->
  <!-- User -->
  <g filter="url(#cardShadow)" transform="translate(40, 68)">
    <rect width="100" height="38" rx="8" fill="#0a1a22" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="100" height="3" rx="1.5" fill="url(#userGrad)"/>
    <text x="50" y="25" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">👤 User</text>
  </g>

  <!-- Agent -->
  <g filter="url(#cardShadow)" transform="translate(220, 68)">
    <rect width="120" height="38" rx="8" fill="#1a1508" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="120" height="3" rx="1.5" fill="url(#agentGrad)"/>
    <text x="60" y="25" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">🤖 Agent</text>
  </g>

  <!-- LLM -->
  <g filter="url(#cardShadow)" transform="translate(430, 68)">
    <rect width="100" height="38" rx="8" fill="#150f28" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="100" height="3" rx="1.5" fill="url(#llmGrad)"/>
    <text x="50" y="25" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">🧠 LLM</text>
  </g>

  <!-- Skill Store -->
  <g filter="url(#cardShadow)" transform="translate(630, 68)">
    <rect width="110" height="38" rx="8" fill="#0a2018" stroke="#10b981" stroke-width="1.5"/>
    <rect width="110" height="3" rx="1.5" fill="url(#skillGrad)"/>
    <text x="55" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">📦 Skill 库</text>
  </g>

  <!-- MCP Tools -->
  <g filter="url(#cardShadow)" transform="translate(820, 68)">
    <rect width="110" height="38" rx="8" fill="#0a1528" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="110" height="3" rx="1.5" fill="url(#toolGrad)"/>
    <text x="55" y="25" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">🔧 MCP 工具</text>
  </g>

  <!-- ===== Lifelines ===== -->
  <line x1="90" y1="106" x2="90" y2="760" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="280" y1="106" x2="280" y2="760" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="480" y1="106" x2="480" y2="760" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="685" y1="106" x2="685" y2="760" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="875" y1="106" x2="875" y2="760" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- ===== Step 1: User sends task to Agent ===== -->
  <g transform="translate(0, 120)">
    <rect x="110" y="0" width="140" height="16" rx="3" fill="#06b6d4" fill-opacity="0.1"/>
    <text x="180" y="12" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600">① 发起任务</text>
    <line x1="90" y1="22" x2="270" y2="22" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <rect x="100" y="30" width="200" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="200" y="41" text-anchor="middle" fill="#94a3b8" font-size="7.5">"帮我写一个 Go HTTP 服务器，含错误处理"</text>
  </g>

  <!-- ===== Step 2: Agent sends task + Skill summaries to LLM ===== -->
  <g transform="translate(0, 165)">
    <!-- Agent activation -->
    <rect x="274" y="0" width="12" height="28" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="300" y="0" width="155" height="16" rx="3" fill="#f59e0b" fill-opacity="0.1"/>
    <text x="377" y="12" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">② 任务 + Skill 简介列表</text>
    <line x1="286" y1="22" x2="470" y2="22" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <!-- Note showing what's sent -->
    <rect x="295" y="32" width="220" height="48" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="305" y="46" fill="#fbbf24" font-size="8" font-weight="600">注入上下文的 Skill 简介：</text>
    <text x="305" y="58" fill="#94a3b8" font-size="7.5">• go-coding-standard: "Go 编码规范，含错误处理模式"</text>
    <text x="305" y="70" fill="#94a3b8" font-size="7.5">• security-review: "安全审查清单，含注入防护"</text>
    <text x="305" y="81" fill="#64748b" font-size="7">（仅名称+一句话描述，不含完整指令）</text>
  </g>

  <!-- ===== Step 3: LLM decides which Skill to load ===== -->
  <g transform="translate(0, 260)">
    <!-- LLM activation (thinking) -->
    <rect x="474" y="0" width="12" height="56" rx="2" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.8"/>
    <rect x="495" y="2" width="200" height="24" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="505" y="14" fill="#a78bfa" font-size="8" font-style="italic">推理：任务涉及 Go + 错误处理</text>
    <text x="505" y="24" fill="#a78bfa" font-size="8" font-style="italic">→ 需要 go-coding-standard 的完整内容</text>
    <!-- Arrow: LLM → Agent (request full skill) -->
    <rect x="320" y="32" width="140" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.1"/>
    <text x="390" y="42" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="600">③ 请求加载 go-coding-standard</text>
    <line x1="474" y1="50" x2="290" y2="50" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurpleBack)"/>
  </g>

  <!-- ===== Step 4: Agent fetches full Skill from store ===== -->
  <g transform="translate(0, 330)">
    <!-- Agent activation -->
    <rect x="274" y="0" width="12" height="28" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.6"/>
    <!-- Agent → Skill Store -->
    <rect x="400" y="0" width="170" height="14" rx="3" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="485" y="11" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">④ 获取完整 Skill 内容</text>
    <line x1="286" y1="20" x2="675" y2="20" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  </g>

  <!-- ===== Step 5: Skill Store returns full content ===== -->
  <g transform="translate(0, 365)">
    <!-- Skill Store → Agent -->
    <rect x="380" y="0" width="200" height="14" rx="3" fill="#10b981" fill-opacity="0.08"/>
    <text x="480" y="11" text-anchor="middle" fill="#34d399" font-size="8" font-weight="600">⑤ 返回完整指令 + 资源 + 工作流</text>
    <line x1="675" y1="20" x2="290" y2="20" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreenBack)"/>
  </g>

  <!-- ===== Step 6: Agent injects full Skill into LLM context ===== -->
  <g transform="translate(0, 395)">
    <!-- Agent → LLM -->
    <rect x="274" y="0" width="12" height="24" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="305" y="0" width="150" height="14" rx="3" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="380" y="11" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">⑥ 注入完整 Skill 到上下文</text>
    <line x1="286" y1="20" x2="470" y2="20" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <!-- Highlight box -->
    <rect x="295" y="28" width="240" height="30" rx="5" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="0.6"/>
    <text x="415" y="41" text-anchor="middle" fill="#34d399" font-size="8" font-weight="600">🔑 渐进式披露完成</text>
    <text x="415" y="52" text-anchor="middle" fill="#64748b" font-size="7">简介 → 选择 → 完整内容，按需展开</text>
  </g>

  <!-- ===== Step 7: LLM generates code under Skill constraints ===== -->
  <g transform="translate(0, 445)">
    <!-- LLM activation (longer, generating) -->
    <rect x="474" y="0" width="12" height="46" rx="2" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.8"/>
    <rect x="495" y="4" width="210" height="38" rx="5" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="505" y="17" fill="#a78bfa" font-size="8" font-weight="600">⑦ 在 Skill 约束下生成代码</text>
    <text x="505" y="29" fill="#94a3b8" font-size="7.5">指令："必须使用 error wrapping 模式"</text>
    <text x="505" y="40" fill="#94a3b8" font-size="7.5">→ fmt.Errorf("ctx: %w", err) 概率↑</text>
  </g>

  <!-- ===== Step 8: LLM requests tool call via Agent ===== -->
  <g transform="translate(0, 505)">
    <!-- LLM → Agent (tool call decision) -->
    <rect x="474" y="0" width="12" height="26" rx="2" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.8"/>
    <rect x="310" y="0" width="150" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.08"/>
    <text x="385" y="11" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="600">⑧ 决定调用 write_file</text>
    <line x1="474" y1="20" x2="290" y2="20" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurpleBack)"/>
  </g>

  <!-- ===== Step 9: Agent executes tool ===== -->
  <g transform="translate(0, 540)">
    <rect x="274" y="0" width="12" height="26" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="490" y="0" width="180" height="14" rx="3" fill="#3b82f6" fill-opacity="0.08"/>
    <text x="580" y="11" text-anchor="middle" fill="#60a5fa" font-size="8" font-weight="600">⑨ 执行工具 write_file</text>
    <line x1="286" y1="20" x2="865" y2="20" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ===== Step 10: Tool returns result ===== -->
  <g transform="translate(0, 575)">
    <rect x="490" y="0" width="160" height="14" rx="3" fill="#3b82f6" fill-opacity="0.08"/>
    <text x="570" y="11" text-anchor="middle" fill="#60a5fa" font-size="8" font-weight="600">⑩ 返回执行结果</text>
    <line x1="865" y1="20" x2="290" y2="20" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowBlueBack)"/>
  </g>

  <!-- ===== Step 11: Agent feeds result back to LLM ===== -->
  <g transform="translate(0, 605)">
    <rect x="274" y="0" width="12" height="24" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="310" y="0" width="145" height="14" rx="3" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="382" y="11" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">结果回注上下文</text>
    <line x1="286" y1="20" x2="470" y2="20" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  </g>

  <!-- ===== Loop box ===== -->
  <g transform="translate(0, 640)">
    <rect x="70" y="0" width="830" height="78" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#64748b" stroke-width="0.8" stroke-dasharray="4 3"/>
    <rect x="70" y="0" width="50" height="14" rx="3" fill="#64748b" fill-opacity="0.3"/>
    <text x="95" y="11" text-anchor="middle" fill="#94a3b8" font-size="7" font-weight="600">loop</text>
    <text x="130" y="11" fill="#64748b" font-size="7">[任务未完成]</text>

    <!-- LLM may request another Skill -->
    <rect x="474" y="18" width="12" height="18" rx="2" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.6"/>
    <text x="495" y="28" fill="#a78bfa" font-size="7.5" font-style="italic">推理：进入新阶段，需要另一个 Skill</text>
    <text x="382" y="40" text-anchor="middle" fill="#64748b" font-size="7">再次渐进式披露：请求新 Skill 完整内容</text>
    <line x1="474" y1="46" x2="290" y2="46" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowPurpleBack)" opacity="0.6"/>

    <!-- Agent fetches and injects -->
    <text x="378" y="60" text-anchor="middle" fill="#64748b" font-size="7">加载新 Skill，卸载旧 Skill，循环继续</text>
    <line x1="286" y1="66" x2="470" y2="66" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowAmber)" opacity="0.6"/>
  </g>

  <!-- ===== Return to user ===== -->
  <g transform="translate(0, 732)">
    <rect x="115" y="0" width="140" height="14" rx="3" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="185" y="11" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">返回最终结果</text>
    <line x1="280" y1="20" x2="100" y2="20" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowAmberBack)"/>
  </g>

  <!-- ===== Key Insight ===== -->
  <g transform="translate(30, 768)">
    <rect width="900" height="56" rx="8" fill="#10b981" fill-opacity="0.05" stroke="#10b981" stroke-width="0.8"/>
    <text x="450" y="16" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">渐进式披露的本质</text>
    <text x="450" y="32" text-anchor="middle" fill="#94a3b8" font-size="9">Agent 只把 Skill 简介（名称+一句话描述）放入上下文 → LLM 根据任务需要选择 → Agent 再加载完整内容</text>
    <text x="450" y="46" text-anchor="middle" fill="#64748b" font-size="8">先给"目录"，按需"翻开具体章节" — 避免一次性塞满上下文窗口，每条信息的影响力最大化</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(30, 832)">
    <line x1="0" y1="6" x2="25" y2="6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="10" fill="#64748b" font-size="7.5">Agent 请求</text>
    <line x1="100" y1="6" x2="125" y2="6" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="130" y="10" fill="#64748b" font-size="7.5">LLM 决策</text>
    <line x1="200" y1="6" x2="225" y2="6" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="230" y="10" fill="#64748b" font-size="7.5">工具调用</text>
    <line x1="300" y1="6" x2="325" y2="6" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="330" y="10" fill="#64748b" font-size="7.5">Skill 响应</text>
    <rect x="400" y="0" width="10" height="12" rx="2" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="415" y="10" fill="#64748b" font-size="7.5">LLM 推理</text>
    <rect x="480" y="0" width="10" height="12" rx="2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="495" y="10" fill="#64748b" font-size="7.5">Agent 处理</text>
  </g>
</svg>