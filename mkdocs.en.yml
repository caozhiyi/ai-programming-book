site_name: First Principles of AI Coding
site_description: Deriving AI coding systems from the ground up
site_author: ekko
site_url: https://caozhiyi.cc/ai-programming-book/en/
repo_name: GitHub
repo_url: https://github.com/caozhiyi/ai-programming-book

# 英文版构建配置：源文件读 docs_en/，输出到 site/en/
docs_dir: docs_en
site_dir: site/en

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate

extra:
  alternate:
    - name: 中文
      link: /ai-programming-book/
      lang: zh
    - name: English
      link: /ai-programming-book/en/
      lang: en
  analytics:
    provider: google
    property: G-4J919K537P

plugins:
  - search
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
  - social

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Preface: index.md

  - "Part I — How LLMs actually work":
    - "Overview": 00a.Part I — How LLMs actually work.md
    - "1. How Large Language Models Actually Work": 01.How Large Language Models Actually Work.md
    - "2. What Interaction with an LLM Really Is": 02.What Interaction with an LLM Really Is.md

  - "Part II — From answering to acting":
    - "Overview": 00b.Part II — From answering to acting.md
    - "3. From Answering to Acting: How Agentic Systems Work": 03.From Answering to Acting How Agentic Systems Work.md
    - "4. Standardizing Tool Use: How MCP Works": 04.Standardizing Tool Use How MCP Works.md
    - "5. Skill as a Packaged Capability": 05.Skill as a Packaged Capability.md
    - "6. When One Agent Is Not Enough": 06.When One Agent Is Not Enough.md
    - "7. Agent Limits and Failure Modes": 07.Agent Limits and Failure Modes.md

  - "Part III — Memory and context engineering":
    - "Overview": 00c.Part III — Memory and context engineering.md
    - "8. Building Memory for AI Systems": 08.Building Memory for AI Systems.md
    - "9. Token Economics and the Art of Context Engineering": 09.Token Economics and the Art of Context Engineering.md
    - "10. Three Paths to Knowledge Injection": 10.Three Paths to Knowledge Injection.md

  - "Part IV — Engineering and Organization":
    - "Overview": 00d.Part IV — Engineering and Organization.md
    - "11. From Prompts to OpenSpec": 11.From Prompts to OpenSpec.md
    - "12. Security and Alignment": 12.Security and Alignment.md
    - "13. Rebuilding Judgment": 13.Rebuilding Judgment.md
    - "14. When AI Enters the Team": 14.When AI Enters the Team.md
    - "15. When AI Enters the Organization": 15.When AI Enters the Organization.md

  - Appendix:
    - "Essay Appendices":
      - "Appendix I — It Is Not a Lesser Human: Notes on What LLMs Actually Are": appendix-llm-intelligence-blackbox.md
      - "Appendix II — Software Ate Only Half the World: From Rule-Based to Token-Based": appendix-software-second-half.md
      - "Appendix III — From API Gateway to AI Gateway: When Infrastructure Is Stretched by Tokens": appendix-ai-gateway-as-infra.md
      - "Appendix IV — The Repriced Engineer: The Second Half of Software Engineering": appendix-engineer-repricing.md
    - "Reference Appendices":
      - "Appendix A — Quick Reference Cards": appendix-quick-reference.md
      - "Appendix B — A 30-Day Practice Path": appendix-30-day-path.md
      - Terminology: TERMINOLOGY.md
