<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'SF Pro Display', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="vecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">RAG workflow: retrieval-augmented generation</text>

  <!-- === Offline Phase (top) === -->
  <text x="80" y="68" fill="#94a3b8" font-size="11" font-weight="600">Offline preparation phase</text>
  <line x1="80" y1="74" x2="720" y2="74" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Documents -->
  <g transform="translate(80, 88)">
    <rect width="130" height="60" rx="8" fill="url(#docGrad)" opacity="0.85"/>
    <text x="65" y="24" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">📄 Internal docs</text>
    <text x="65" y="42" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Wiki · API docs · code</text>
  </g>

  <!-- Arrow -->
  <line x1="218" y1="118" x2="258" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="238" y="108" text-anchor="middle" fill="#64748b" font-size="8">Chunking</text>

  <!-- Chunks -->
  <g transform="translate(266, 88)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="10" y="10" width="50" height="14" rx="3" fill="#334155"/>
    <rect x="68" y="10" width="50" height="14" rx="3" fill="#334155"/>
    <rect x="10" y="30" width="50" height="14" rx="3" fill="#334155"/>
    <rect x="68" y="30" width="50" height="14" rx="3" fill="#334155"/>
    <text x="65" y="56" text-anchor="middle" fill="#94a3b8" font-size="8">Document chunks</text>
  </g>

  <!-- Arrow -->
  <line x1="404" y1="118" x2="444" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="424" y="108" text-anchor="middle" fill="#64748b" font-size="8">Embed</text>

  <!-- Vector DB -->
  <g transform="translate(452, 88)">
    <rect width="130" height="60" rx="8" fill="url(#vecGrad)" opacity="0.85"/>
    <text x="65" y="24" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">🗄️ Vector DB</text>
    <text x="65" y="42" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">[0.12, -0.34, 0.87, ...]</text>
  </g>

  <!-- === Online Phase (bottom) === -->
  <text x="80" y="186" fill="#94a3b8" font-size="11" font-weight="600">Online query phase</text>
  <line x1="80" y1="192" x2="720" y2="192" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- User Query -->
  <g transform="translate(80, 206)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">👤 User query</text>
    <text x="65" y="42" text-anchor="middle" fill="#94a3b8" font-size="9">"Add a route in infra-go?"</text>
  </g>

  <!-- Arrow down to vector DB -->
  <path d="M 210 236 L 260 236 L 260 148 L 380 148 L 380 236 L 440 236" stroke="#67e8f9" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <text x="320" y="168" text-anchor="middle" fill="#67e8f9" font-size="8">Semantic search</text>

  <!-- Retrieved chunks -->
  <g transform="translate(266, 206)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="600">Retrieval results</text>
    <text x="65" y="36" text-anchor="middle" fill="#94a3b8" font-size="8">✓ infra-go route docs</text>
    <text x="65" y="48" text-anchor="middle" fill="#94a3b8" font-size="8">✓ Handler binding example</text>
  </g>

  <!-- Arrow -->
  <line x1="404" y1="236" x2="444" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="424" y="226" text-anchor="middle" fill="#64748b" font-size="8">Inject</text>

  <!-- LLM -->
  <g transform="translate(452, 206)">
    <rect width="130" height="60" rx="8" fill="url(#llmGrad)" opacity="0.85"/>
    <text x="65" y="24" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">🤖 LLM</text>
    <text x="65" y="42" text-anchor="middle" fill="#fff" font-size="9" opacity="0.8">Query + docs → answer</text>
  </g>

  <!-- Arrow -->
  <line x1="590" y1="236" x2="630" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Output -->
  <g transform="translate(638, 206)">
    <rect width="130" height="60" rx="8" fill="url(#outGrad)" opacity="0.85"/>
    <text x="65" y="24" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">✅ Grounded answer</text>
    <text x="65" y="42" text-anchor="middle" fill="#e2e8f0" font-size="9" opacity="0.8">Backed by infra-go docs</text>
  </g>

  <!-- Connection: vector DB to retrieval -->
  <line x1="517" y1="148" x2="517" y2="206" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <g transform="translate(80, 290)">
    <rect width="688" height="90" rx="10" fill="#1e293b" opacity="0.5"/>
    <text x="20" y="22" fill="#f59e0b" font-size="11" font-weight="600">💡 Key insight</text>
    <text x="20" y="42" fill="#94a3b8" font-size="10">RAG doesn't change the model — weights stay untouched. It just slots the needed knowledge into the context window on each call.</text>
    <text x="20" y="60" fill="#94a3b8" font-size="10">The flow is transparent: the user asks; the system retrieves and injects behind the scenes; they see an AI that "knows infra-go."</text>
    <text x="20" y="78" fill="#64748b" font-size="9">Offline phase runs once (re-run when docs update); online phase runs on every query.</text>
  </g>
</svg>
