    - "2. 与大模型交互的本质": 02.与大模型交互的本质.md

  - "卷二: 从对话到自主":
    - 00b.卷二导读从对话到自主.md
    - "3. 从问答到执行Agentic的运行原理": 03.从问答到执行Agentic的运行原理.md
    - "4. 工具的标准化MCP交互原理": 04.工具的标准化MCP交互原理.md
    - "5. 预定义的能力包Skill交互原理": 05.预定义的能力包Skill交互原理.md
    - "6. 一个不够用多Agent协作原理": 06.一个不够用多Agent协作原理.md
