site_name: AI编程的第一性原理
site_description: 从问答到执行的系统化推导
site_author: ekko
site_url: https://caozhiyi.cc/ai-programming-book/
repo_name: GitHub
repo_url: https://github.com/caozhiyi/ai-programming-book

# 中文版构建配置
docs_dir: docs
site_dir: site

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    # 浅色模式切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗黑模式
    # 暗黑模式切换
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.top # 返回顶部按钮
    - navigation.footer # 底部翻页组件
    - content.code.copy # 代码块复制按钮
    - content.code.annotate # 代码交互注释

extra:
  alternate:
    - name: 中文
      link: /ai-programming-book/
      lang: zh
    - name: English
      link: /ai-programming-book/en/
      lang: en
  analytics:
    provider: google
    property: G-4J919K537P

plugins:
  - search
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
  - social

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - 前言: index.md

  - "卷一: 大模型的运行真相":
    - 00a.卷一导读大模型的运行真相.md
    - "1. 大模型是怎么思考的": 01.大模型是怎么思考的.md
    - "2. 与大模型交互的本质": 02.与大模型交互的本质.md

  - "卷二: 从对话到自主":
    - 00b.卷二导读从对话到自主.md
    - "3. 从问答到执行Agentic的运行原理": 03.从问答到执行Agentic的运行原理.md
    - "4. 工具的标准化MCP交互原理": 04.工具的标准化MCP交互原理.md
    - "5. 预定义的能力包Skill交互原理": 05.预定义的能力包Skill交互原理.md
    - "6. 一个不够用多Agent协作原理": 06.一个不够用多Agent协作原理.md
    - "7. Agent的能力边界与失败模式": 07.Agent的能力边界与失败模式.md

  - "卷三: 记忆与上下文工程":
    - 00c.卷三导读记忆与上下文.md
    - "8. 让AI记住你：记忆体系的原理与设计": 08.让AI记住你：记忆体系的原理与设计.md
    - "9. Token经济学：上下文工程的艺术": 09.Token经济学：上下文工程的艺术.md
    - "10. 知识注入：从 RAG 到代码库原生检索": "10.知识注入：从 RAG 到代码库原生检索.md"

  - "卷四: 工程化与组织化":
    - 00d.卷四导读工程化与组织化.md
    - "11. 规范驱动编程：当需求变成工程产物": 11.规范驱动编程：从提示词到OpenSpec.md
    - "12. 安全与对齐：AI系统的信任边界": 12.安全与对齐：AI系统的信任边界.md
      - "13. 判定权重建：AI写的代码该怎么审": 13.判定权重建.md
    - "14. 当AI进入团队：协同重排": 14.当AI进入团队：协同重排.md
    - "15. 当AI进入组织：从工具到能力底座": 15.当AI进入组织：从工具到能力底座.md

  - 附录:
    - 文章附录:
      - "智能黑箱：关于 LLM 智能本身的几个判断": llm-intelligence-blackbox.md
      - "软件吃掉了世界的一半": software-second-half.md
      - "从 API 网关到 AI 网关": ai-gateway-as-infra.md
      - "被重新定价的工程师": engineer-repricing.md
    - 工具附录:
